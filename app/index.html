<style>
:root{

  --mute:#6B7369; --line:#D8D5CB; --card:#FFFFFF; --red:#B4382B; --ok:#2C6A47;
  --tap:48px; --radius:10px;
  font-size:17px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--tap) + 84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:1.05rem;margin:0;font-weight:600;letter-spacing:.2px;flex:1}
.pill{font-size:.72rem;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.15);white-space:nowrap}
.pill.off{background:var(--amber);color:var(--ink)}
.pill.pending{background:#fff;color:var(--green)}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:48px;z-index:5;overflow-x:auto}
nav button{flex:1;min-width:84px;min-height:var(--tap);border:0;background:none;font:inherit;font-size:.9rem;color:var(--mute);border-bottom:3px solid transparent}
nav button.on{color:var(--green);border-bottom-color:var(--amber);font-weight:600}
main{padding:12px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.card h2{font-size:1rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
label{display:block;font-size:.8rem;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;min-height:var(--tap);font:inherit;font-size:1.05rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
input[type=number]{font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.btn{min-height:var(--tap);padding:0 16px;border-radius:8px;border:1px solid var(--green);background:var(--green);color:#fff;font:inherit;font-weight:600}
.btn.sec{background:#fff;color:var(--green)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
.btn.sm{min-height:36px;padding:0 10px;font-size:.85rem;font-weight:500}
.btn:disabled{opacity:.45}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;min-height:var(--tap);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.item .t{flex:1}
.item .t b{display:block}
.item .t small{color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;font-size:.75rem}
td input{min-height:40px;padding:4px 6px;font-size:1rem;text-align:right;width:82px}
td.name{font-weight:600}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.species{margin-top:10px;border-top:2px solid var(--green);padding-top:8px}
.species h3{margin:0 0 6px;font-size:.95rem;display:flex;gap:8px;align-items:center}
.species h3 .sp{flex:1}
.pctbad{color:var(--red);font-weight:600}
.totals{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:8px;z-index:6}
.totals div{font-size:.7rem;color:#B9C1B9}
.totals b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums;color:#fff}
.totals b.amb{color:var(--amber)}
.muted{color:var(--mute);font-size:.85rem}
.empty{padding:24px;text-align:center;color:var(--mute)}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:.9rem;z-index:9;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.scroll{overflow-x:auto}
.man input,.man select{border-color:var(--amber);background:#fff8e6}.auto input{border-color:#4477aa;background:#eef3fb}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi .k{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi .k small{display:block;color:var(--mute);font-size:.7rem;text-transform:uppercase;letter-spacing:.3px}.kpi .k b{font-size:1.2rem;font-variant-numeric:tabular-nums}#map{height:420px;border-radius:10px;border:1px solid var(--line);z-index:1}.lg{display:flex;flex-wrap:wrap;gap:8px;font-size:.8rem;margin-top:6px}.nogl{background:rgba(255,255,255,.75);border:0;color:#123;font-weight:600;font-size:10px;padding:1px 3px}
.lg span i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:middle}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.kv b{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (min-width:900px){nav{top:48px} main{padding:20px}}
</style>
</head>

 for(const n of nodes){if(n.parentNode&&["SCRIPT","STYLE","TEXTAREA"].includes(n.parentNode.tagName))continue;let v=n.nodeValue;if(!v.trim())continue;const tr=v.trim();
  if(RU_LONG[tr]){n.nodeValue=v.replace(tr,RU_LONG[tr]);continue;}
  if(RU[tr]){n.nodeValue=v.replace(tr,RU[tr]);continue;}
  for(const [rx,rep] of RU_RX)v=v.replace(rx,rep);
  for(const k of RU_KEYS){if(k.length<3)continue;if(v.includes(k))v=v.split(k).join(RU[k]);}
  n.nodeValue=v;}
 root.querySelectorAll("input[placeholder]").forEach(i=>{if(RU[i.placeholder])i.placeholder=RU[i.placeholder];});}

/* calculations, all deterministic */
function calcCirsma(c){
 let m3=0,rev=0;const bySp={};
 for(const s of SPECIES){const sp=c.species[s];if(!sp)continue;const sm3=num(sp.m3);let val=0,pct=0;
  for(const [sort,price] of S.prices[s]){const p=num(sp.pct[sort]);pct+=p;val+=sm3*p*num(price);}
  bySp[s]={m3:sm3,val,pct,celma:sm3?val/sm3-(num(c.sagat)+num(c.piev)+num(c.trans)):0};m3+=sm3;rev+=val;}
 const costM3=num(c.sagat)+num(c.piev)+num(c.trans),cost=m3*costM3,max=rev*(1-num(c.marza))-cost;
 return {m3,rev,cost,costM3,max,bySp,revM3:m3?rev/m3:0,vidKoks:num(c.koki)?m3/num(c.koki):0,m3ha:num(c.platiba)?m3/num(c.platiba):0};
}
function calcProp(p){const t={m3:0,rev:0,cost:0,max:0,ha:0};for(const c of p.cirsmas){const r=calcCirsma(c);t.m3+=r.m3;t.rev+=r.rev;t.cost+=r.cost;t.max+=r.max;t.ha+=num(c.platiba);}return t;}
function krajaMer(m){if(m.krajaImp!=null&&m.krajaImp>0)return num(m.krajaImp);const f=m.f??FORM_FACTOR[m.suga]??.45;return num(m.G)*num(m.H)*f*num(m.platMezs||m.platKop);}
function bonitate(H,age){ // Orlov-type approximation, replace with your table if needed
 if(!H||!age)return "";const h50=H*Math.pow(50/age,.6);const cls=[[30,"Ia"],[27,"I"],[24,"II"],[21,"III"],[17,"IV"],[13,"V"],[0,"Va"]];return cls.find(x=>h50>=x[0])[1]+" (≈)";}

 const q=[...S.queue];for(const id of q){const p=S.props.find(x=>x.id===id);try{
  const r=await fetch(endpoint.replace(/\/$/,"")+"/props/"+id,{method:"PUT",headers:{"Content-Type":"application/json",...(token?{"Authorization":"Bearer "+token}:{})},body:JSON.stringify(p||{id,deleted:true})});
  if(!r.ok)throw new Error(r.status);S.queue=S.queue.filter(x=>x!==id);}catch(e){console.warn("sync",e);}}
 localStorage.setItem(KEY,JSON.stringify(S));updNet();}

 const r=await fetch(endpoint.replace(/\/$/,"")+"/props",{headers:token?{"Authorization":"Bearer "+token}:{}});const list=await r.json();let n=0;
 for(const rp of list){const lp=S.props.find(x=>x.id===rp.id);if(!lp){S.props.push(rp);n++;}else if((rp.updatedAt||0)>(lp.updatedAt||0)&&!S.queue.includes(rp.id)){Object.assign(lp,rp);n++;}}

function addMer(){const m=newMer();P().mer.push(m);S.open=m.id;save(S.cur);}
const M=id=>P().mer.find(m=>m.id===id);
function mf(id,k,v){M(id)[k]=v;recalcLinked();save(S.cur);}
function recalcAll(){const cur=S.cur;for(const p of S.props){S.cur=p.id;recalcLinked();}S.cur=cur;}
function recalcLinked(){const p=P();if(p.cirsmas.some(c=>c.tips==="Kc"))applyBuffers(p);for(const c of p.cirsmas){const linked=p.mer.filter(m=>m.cirsma===c.id);if(linked.length)rebuildCirsma(c,linked);}}
function rebuildCirsma(c,linked){for(const s of SPECIES)c.species[s].m3=0;c.platiba=0;const acc={};c.bruto=0;c.eko=0;c.zud=0;c.atlikts=0;
 for(const m of linked){let kr=krajaMer(m);if(m.cirsmaKods==="KKC"){if(m.hasCert){if(!(m.certamais>0)){continue;}kr=m.certamais;}else kr=kkcCertamais(m).m3;}const ha=num(m.platMezs||m.platKop);const defFrac=Math.min(1,Math.max(0,num(m.buferPct)/100));c.atlikts=(c.atlikts||0)+kr*defFrac;kr*=(1-defFrac);c.bruto+=kr;
  const eko=S.settings.ekoKoki===false?0:Math.min(kr,(RULES.ecoTreesHa[m.cirsmaKods==="KKC"?"KKC":"KC"]||0)*ha*RULES.ecoTreeM3);const zud=(kr-eko)*num(S.settings.zudumi)/100;c.eko+=eko;c.zud+=zud;kr=kr-eko-zud;const sh=speciesShares(m);
  for(const s2 in sh){if(!c.species[s2])continue;const v=kr*sh[s2];c.species[s2].m3=num(c.species[s2].m3)+v;const ss=sortSharesForD(s2,m.D);acc[s2]=acc[s2]||{};for(const k in ss)acc[s2][k]=(acc[s2][k]||0)+v*ss[k];}
  c.platiba=+(num(c.platiba)+num(m.platMezs||m.platKop)).toFixed(2);}
 for(const s2 in acc){const tot=Object.values(acc[s2]).reduce((a,b)=>a+b,0);c.species[s2].m3=Math.round(c.species[s2].m3);if(tot&&!c.species[s2].manual){for(const k in acc[s2])c.species[s2].pct[k]=+(acc[s2][k]/tot).toFixed(3);}}}
function ff(id,i,k,v){M(id).formula[i][k]=k==="k"?num(v):v;recalcLinked();save(S.cur);}
function fadd(id){M(id).formula.push({s:"Egle",k:0});save(S.cur);}
function fdel(id,i){M(id).formula.splice(i,1);save(S.cur);}
function delMer(id){arm("m"+id,"",()=>{P().mer=P().mer.filter(m=>m.id!==id);recalcLinked();save(S.cur);});}
function speciesShares(m){const out={};if(m.sugas){const tot=Object.values(m.sugas).reduce((a,b)=>a+b,0);if(tot){for(const s in m.sugas)out[s]=m.sugas[s]/tot;return out;}}const ks=m.formula.reduce((a,x)=>a+num(x.k),0)||10;for(const f of m.formula)if(f.s)out[f.s]=(out[f.s]||0)+num(f.k)/ks;return out;}
function toCirsma(id){const m=M(id);const cid=document.getElementById("tc-"+id).value;if(!cid)return toast("Izvēlies cirsmu");const c=C(cid);const kr=krajaMer(m);const ks=m.formula.reduce((a,x)=>a+num(x.k),0)||10;
 const shares=speciesShares(m);for(const s2 in shares){if(!c.species[s2])continue;c.species[s2].m3=Math.round(num(c.species[s2].m3)+kr*shares[s2]);}
 c.platiba=num(c.platiba)+num(m.platMezs||m.platKop);m.cirsma=cid;toast(`Pieskaitīti ${fmt(kr)} m³`);save(S.cur);}

function valAutoHa(p){const out=Object.fromEntries(VAL_ROWS.map(r=>[r[0],0]));
 for(const m of p.mer){const ha=num(m.platMezs||m.platKop);if(!ha)continue;

  if(m.mezaTips==="Purvājs"||(nonforest&&!/krūm/i.test(m.veids))){out.nev+=ha;continue;}
  if(/krūm/i.test(m.veids)){out.krum+=ha;continue;}
  const wet=moistureOf(m.mezaTips)!=="sausie";
  if(m.cirsmaKods==="KC"||m.veids==="Izcirtums"){out[wet?"kcW":"kcS"]+=ha;continue;}

  const peb=PEB.includes(m.suga);out[peb?(wet?"jPEBw":"jPEBs"):(wet?"jPARw":"jPARs")]+=ha;}

 for(let i=0;i<200;i++){const m=(lo+hi)/2;(f(lo)*f(m)<=0)?hi=m:lo=m;}

const GEO_BASE_DEFAULT="https://raw.githubusercontent.com/kgudonis-dotcom/geo-ingest/data";
function geoBase(){return (S.settings.geoBase||GEO_BASE_DEFAULT).replace(/\/$/,"");}
async function cachedFetch(url){try{const c=await caches.open("geo-v1");const hit=await c.match(url);if(hit&&!navigator.onLine)return hit;
  try{const r=await fetch(url,{cache:"no-cache"});if(r.ok){c.put(url,r.clone());return r;}if(hit)return hit;return r;}catch(e){if(hit)return hit;throw e;}}
 catch(e){return fetch(url);}}
async function gunzipJson(resp){const buf=await resp.arrayBuffer();
 if(typeof DecompressionStream!=="undefined"){const ds=new DecompressionStream("gzip");const txt=await new Response(new Blob([buf]).stream().pipeThrough(ds)).text();return JSON.parse(txt);}
 if(window.pako)return JSON.parse(pako.ungzip(new Uint8Array(buf),{to:"string"}));
 throw new Error("Pārlūks neatbalsta gzip atspiešanu");}
async function loadPagasts(code){const r=await cachedFetch(`${geoBase()}/pagasti/${code}.json.gz`);if(!r.ok)throw new Error("HTTP "+r.status);return gunzipJson(r);}
function pagastsToExtra(kad,zvd){const st=zvd.stands;const key=x=>String(x.kv??"")+"-"+String(x.nog??"")+((x.anog&&String(x.anog)!=="0")?"."+x.anog:"");
 const items=st.map(x=>{const props={kvartals:x.kv,nogabals:x.nog,anog:x.anog,platiba_ha:x.plat};for(const k in x)if(!["kv","nog","anog","plat","geom"].includes(k))props[k]=x[k];return {props,geom:{type:"Polygon",coordinates:[x.geom]}};});
 const adjacency=(zvd.adj||[]).map(([i,j,L])=>({a:key(st[i]),b:key(st[j]),len_m:L}));
 const protectedL=(zvd.iadt||[]).map(x=>({kind:x.kind,name:x.name,zone:x.zone,overlap_ha:x.ha}));
 return {items,extra:{adjacency,protected:protectedL,expl:zvd.expl||[],kaimZV:zvd.kaimini||[],lielie:zvd.lielie||[],owners:zvd.owners||[]}};}
async function createFromPagasts(kad){toast("Ielādē pagasta "+kad.slice(0,4)+" datus...");
 const data=await loadPagasts(kad.slice(0,4));const zvd=data.zv&&data.zv[kad];
 if(!zvd)throw new Error("Kadastrs "+kad+" pagasta failā nav (fails: "+(data.updated||"?")+")");
 const {items,extra}=pagastsToExtra(kad,zvd);buildFromGeo(kad,items,extra);P().geoUpdated=data.updated;

function lksTiles(p){const t=new Set();for(const m of p.mer)if(m.geom)for(const [lo,la] of m.geom){const [x,y]=wgsToLks(lo,la);t.add(`${Math.floor(x/10000)}_${Math.floor(y/10000)}`);}return [...t];}
function aplProp(props,re){for(const k in props)if(re.test(k))return props[k];return "";}
function aplDate(v){if(!v)return "";if(typeof v==="number"){const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString("lv-LV");}return String(v);}
async function loadAplieci(p){if(typeof turf==="undefined")return 0;const tiles=lksTiles(p);p.aplieci=[];const seen=new Set();
 const own=p.mer.filter(m=>m.geom).map(m=>({m,f:merFeature(m)}));if(!own.length)return 0;
 const hull=turf.buffer(turf.union(turf.featureCollection(own.map(o=>o.f)))||own[0].f,0.05,{units:"kilometers"});
 for(const t of tiles){let fc;try{const r=await cachedFetch(`${geoBase()}/aplieci/${t}.json`);if(!r.ok)continue;fc=await r.json();}catch(e){continue;}
  for(const f of fc.features||[]){try{if(!turf.booleanIntersects(f,hull))continue;
    const key=JSON.stringify([f.properties,(f.geometry.coordinates+"").slice(0,40)]);if(seen.has(key))continue;seen.add(key);
    const hitNog=own.filter(o=>{try{const i=turf.intersect(turf.featureCollection([f,o.f]));return i&&turf.area(i)>100;}catch(e){return false;}}).map(o=>o.m.nogabals);
    const pr=f.properties||{};p.aplieci.push({own:hitNog.length>0,nog:hitNog,nr:aplProp(pr,/nr|numur|number/i),veids:aplProp(pr,/cirt.*veid|veid/i),izsn:aplDate(aplProp(pr,/izsn|issue|datum|date/i)),derigs:aplDate(aplProp(pr,/der[iī]g|valid|l[iī]dz|expir/i)),plat:aplProp(pr,/plat|area/i),kad:aplProp(pr,/kadastr|kad_/i),geom:f.geometry,props:pr});}catch(e){}}}
 p.aplieciChecked=new Date().toISOString().slice(0,10);return p.aplieci.length;}

 const big=(p.lielie||[]).map(x=>`<div class="kv"><span>${esc(x.owner)}</span><b>${x.hops===1?"robežojas":x.hops?x.hops+". īpašums pa ķēdi":"pāri laukiem"}${x.dist_m!=null?" · "+fmt(x.dist_m)+" m":""}${x.kad?" · "+esc(x.kad):""}</b></div>`).join("");

const DEFAULT_LIEPA={Priede:[1.6541e-4,.56582,.25924,1.59689],Egle:[2.3106e-4,.78193,.34175,1.18811],Bērzs:[0.9090e-4,.71677,.16692,1.75701],

 Ozols:[1.3465e-4,.68120,.14550,1.68325],Osis:[1.3465e-4,.68120,.14550,1.68325],"Citas sugas":[0.9090e-4,.71677,.16692,1.75701]};
function treeVol(sp,D,H){const k=(S.liepa||DEFAULT_LIEPA)[sp]||DEFAULT_LIEPA["Citas sugas"];if(!(D>0&&H>0))return 0;return k[0]*Math.pow(H,k[1])*Math.pow(D,k[2]*Math.log10(H)+k[3]);}
// standarta augstuma līkne, ja dastojumā H nav: H(D) = Hvid·(D/Dvid)^0.35 (tuvinājums)
function hCurve(D,Hv,Dv){return Hv&&Dv?Hv*Math.pow(D/Dv,0.35):Hv||0;}

function tallyCalc(tally,ctx){const out={};let m3=0,n=0;const acc={};
 for(const t of tally){const sp=t.sp||ctx.sp||"Citas sugas";const H=t.H||hCurve(t.D,ctx.H,ctx.D);const v=treeVol(sp,t.D,H);const cnt=num(t.n);if(!cnt)continue;

 const brutoNow=realized+remaining-c.iegade-moneyCost;const target=num(S.settings.targetBruto)||20;

function fundStats(props){const st={n:props.length,ha:0,mezHa:0,kraja:0,cut:0,max:0,ni:0,sp:{},age:{},land:{sausie:0,slapjie:0,purvi:0,liz:0,krum:0,nev:0},objs:[]};
 for(const p of props){const t=calcProp(p);const c=valCalc(p);let ha=0,mez=0,kr=0;
  for(const m of p.mer){const a=num(m.platKop);ha+=a;const k=krajaMer(m);const mt=m.mezaTips||"";
   if(m.suga||num(m.krajaImp)){mez+=num(m.platMezs||m.platKop);kr+=k;const sh=speciesShares(m);for(const s in sh)st.sp[s]=(st.sp[s]||0)+k*sh[s];
    const ag=AGE_GROUPS.find(g=>num(m.vecums)>=g[1]&&num(m.vecums)<=g[2])||AGE_GROUPS[0];st.age[ag[0]]=(st.age[ag[0]]||0)+num(m.platMezs||m.platKop);
    if(/purv|Niedr|Dumbr|Liek/i.test(mt))st.land.purvi+=a;else if(isDry(mt))st.land.sausie+=a;else st.land.slapjie+=a;}
   else{if(/krūm/i.test(m.veids))st.land.krum+=a;else if(/purv|bebr|appl/i.test(m.veids+mt))st.land.purvi+=a;else st.land.nev+=a;}}
  const v=valOf(p);st.land.liz+=num(v.ha.lizB)+num(v.ha.lizP);
  st.ha+=ha;st.mezHa+=mez;st.kraja+=kr;st.cut+=t.m3;st.max+=t.max;st.ni+=c.mezsSale+c.lizSale+c.krumSale;

 return st;}

function unionRings(mers){ // apvieno nogabalu ģeometrijas ar turf, atgriež LKS-92 gredzenu(s)
 const feats=mers.filter(m=>m.geom).map(m=>({type:"Feature",properties:{},geometry:{type:"Polygon",coordinates:[m.geom]}}));
 if(!feats.length)return null;let u=feats[0];
 try{for(let i=1;i<feats.length;i++)u=turf.union(turf.featureCollection([u,feats[i]]))||u;}catch(e){console.warn(e);}
 const g=u.geometry;const rings=g.type==="MultiPolygon"?g.coordinates.map(c=>c[0]):[g.coordinates[0]];
 return rings.map(r=>r.map(([lo,la])=>wgsToLks(lo,la)));}
function skiceHtml(c){const p=P();const linked=p.mer.filter(m=>m.cirsma===c.id&&m.geom);if(!linked.length)return null;
 const rings=unionRings(linked);if(!rings)return null;
 const all=rings.flat();const xs=all.map(a=>a[0]),ys=all.map(a=>a[1]);
 const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
 const scale=(S.settings.skiceScale||5000);const wm=0.17*scale,hm=0.20*scale; // ~17×20 cm kartes lauks
 const ctx=p.mer.filter(m=>m.geom&&m.cirsma!==c.id).map(m=>({r:m.geom.map(([lo,la])=>wgsToLks(lo,la)),n:m.nogabals}));
 const X=x=>((x-(cx-wm/2))/wm*640).toFixed(1),Y=y=>((1-(y-(cy-hm/2))/hm)*760).toFixed(1);
 let svg=`<svg viewBox="0 0 640 760" style="width:100%;max-width:640px;border:1px solid #ccc">`;
 for(const o of ctx){svg+=`<polyline points="${o.r.map(([x,y])=>X(x)+","+Y(y)).join(" ")}" fill="none" stroke="#c66" stroke-width="0.7"/>`;const rx=o.r.reduce((a,b)=>a+b[0],0)/o.r.length,ry=o.r.reduce((a,b)=>a+b[1],0)/o.r.length;svg+=`<text x="${X(rx)}" y="${Y(ry)}" font-size="9" fill="#777" text-anchor="middle">${esc(o.n)}</text>`;}
 let verts=[];rings.forEach(r=>{const rr=(r[0][0]===r[r.length-1][0]&&r[0][1]===r[r.length-1][1])?r.slice(0,-1):r;verts.push(...rr);
  svg+=`<polygon points="${r.map(([x,y])=>X(x)+","+Y(y)).join(" ")}" fill="#e8f2e8" stroke="red" stroke-width="1.8"/>`;});
 verts.forEach(([x,y],i)=>{svg+=`<circle cx="${X(x)}" cy="${Y(y)}" r="2" /><text x="${+X(x)+4}" y="${+Y(y)-3}" font-size="9">${i+1}</text>`;});
 svg+=`<text x="610" y="20" font-size="12">Z</text><line x1="614" y1="46" x2="614" y2="26" stroke="#000" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto"><path d="M0,4 L4,0 L8,4z"/></marker></defs>`;
 svg+=`<line x1="30" y1="740" x2="${30+100/scale*1000/ (wm/640)}" y2="740" stroke="#000" stroke-width="2"/><text x="30" y="732" font-size="9">100 m</text></svg>`;
 const ha=num(c.platiba)||linked.reduce((a,m)=>a+num(m.platMezs||m.platKop),0);
 const rows=verts.map(([x,y],i)=>`<tr><td>${i+1}</td><td>${x.toFixed(2)}</td><td>${y.toFixed(2)}</td></tr>`).join("");
 return `<!doctype html><html><head><meta charset="utf-8"><title>Skice</title><style>body{font-family:sans-serif;margin:24px;font-size:13px}h1,h2,h3{text-align:center;margin:2px}table{border-collapse:collapse;font-size:10px}td,th{padding:1px 8px;text-align:right}main{display:flex;gap:18px}@media print{button{display:none}}</style></head><body>
 <h3>${esc(p.novads||"")}</h3><h2>"${esc(p.name)}"</h2><h3>${esc(c.tips)} · ${esc(c.kvartals)}. kvartāls ${esc(c.nogabali.replace(/;/g,", "))}. nogabals, platība ${fmt(ha,2)} ha</h3>

const FIELDS=[["kadastrs","Kadastrs"],["kvartals","Kvartāls"],["nogabals","Nogabals"],["platiba","Platība ha"],["veids","Zemes veids"],["mezaTips","Meža tips"],["suga","Valdošā suga"],["sastavs","Sastāva formula"],["vecums","Vecums"],["D","Caurmērs D"],["H","Augstums H"],["G","Šķērslaukums G"],["kraja","Krāja m³"],["krajaHa","Krāja m³/ha"],["certamais","Cērtamais m³"],["sugukraja","Krāja pa sugām"],["cirsma","Cirsma (KC/KKC)"],["ierob","Ierobežojumi"],["invGads","Inv. gads"],["bon","Bonitāte"],["pedCirte","Pēd. cirte"],["pedCirteG","Pēd. cirtes gads"],["pedDarb","Pēd. darbība"],["pedDarbG","Pēd. darbības gads"]];

async function impFile(f){if(!f)return;IMP={rows:[],hdr:0,map:{},name:f.name.replace(/\.[^.]+$/,""),kadastrs:(f.name.match(/\d{11}/)||[""])[0],src:f.name};
 try{if(/\.pdf$/i.test(f.name))IMP.rows=await readPdf(f);else IMP.rows=await readSheet(f);}catch(e){console.error(e);toast("Neizdevās nolasīt failu");return;}
 IMP.hdr=findHeader(IMP.rows);if(!IMP.kadastrs){const t=IMP.rows.flat().join(" ");IMP.kadastrs=(t.match(/\b\d{11}\b/)||[""])[0];}if(IMP.rows[0]&&IMP.rows[0][0]==="kadastrs")IMP.hdr=0;
 guessMap();render();toast(`Nolasītas ${IMP.rows.length} rindas`);}
async function readSheet(f){if(!window.XLSX)throw new Error("XLSX nav ielādēts");const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];return XLSX.utils.sheet_to_json(ws,{header:1,defval:""}).filter(r=>r.some(c=>String(c).trim()!==""));}
async function readPdf(f){if(!window.pdfjsLib)throw new Error("pdf.js nav ielādēts");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
 const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;const rows=[];
 for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();const lines={};
  for(const it of tc.items){if(!it.str.trim())continue;const y=Math.round(it.transform[5]/3)*3;(lines[y]=lines[y]||[]).push({x:it.transform[4],s:it.str.trim()});}
  Object.keys(lines).map(Number).sort((a,b)=>b-a).forEach(y=>{const cells=lines[y].sort((a,b)=>a.x-b.x).map(c=>c.s);rows.push(cells);});}
 const parsed=parsePdfLines(rows.map(r=>r.join(" ")));if(parsed&&parsed.length>1){IMP.src+=" (VMD formāts atpazīts)";return parsed;}
 return rows;}
function findHeader(rows){let best=0,bs=-1;rows.slice(0,40).forEach((r,i)=>{const t=r.join(" ").toLowerCase();let sc=0;for(const k in GUESS)if(GUESS[k].some(g=>t.includes(g)))sc++;if(sc>bs){bs=sc;best=i;}});return best;}
const EXACT={kadastrs:"kadastrs",kvartals:"kvartāls",nogabals:"nogabals",platiba:"platība",veids:"veids",mezaTips:"meža_tips",suga:"suga",sastavs:"formula",vecums:"vecums",H:"augstums",G:"šķērslaukums",kraja:"krāja",krajaHa:"kraja_ha",D:"caurmērs",certamais:"certamais",sugukraja:"sugu_krāja",cirsma:"cirsma",ierob:"ierobežojumi",invGads:"inv_gads",bon:"bonitāte",pedCirte:"pēd_cirte",pedCirteG:"pēd_cirte_g",pedDarb:"pēd_darbība",pedDarbG:"pēd_darb_g"};
function guessMap(){const hdr=(IMP.rows[IMP.hdr]||[]).map(c=>String(c).toLowerCase().trim());IMP.map={};
 for(const k in EXACT){const i=hdr.indexOf(EXACT[k]);if(i>=0)IMP.map[k]=i;}
 for(const k in GUESS){if(IMP.map[k]!=null)continue;const i=hdr.findIndex(c=>GUESS[k].some(g=>c.includes(g)));if(i>=0&&!Object.values(IMP.map).includes(i))IMP.map[k]=i;}
 // fallback to known Kadastra atskaite layout (D veids, E meža tips, F platība, J suga, Q cirsma)
 if(IMP.map.platiba==null&&hdr.length>16){Object.assign(IMP.map,{veids:3,mezaTips:4,platiba:5,suga:9,cirsma:16});}
 if(S.settings.impMap)for(const k in S.settings.impMap)if(IMP.map[k]==null&&hdr[S.settings.impMap[k]])IMP.map[k]=S.settings.impMap[k];}
function parseSastavs(str,fallback){const out=[];const re=/(\d+)\s*(Ba|Ma|Ap|Oz|Os|Bl|Ie|Kr|P|E|B|A|M|L|K|C)/g;let m;const code2sp=Object.assign({C:"Citas sugas"},SPC);
 while((m=re.exec(String(str||""))))out.push({s:code2sp[m[2]],k:num(m[1])});
 return out.length?out:[{s:normSp(fallback),k:10}];}
function normSp(v){v=String(v||"").trim();if(!v)return "";const l=v.toLowerCase();for(const s of SPECIES)if(l.startsWith(s.toLowerCase().slice(0,4)))return s;if(l.startsWith("balt"))return "Baltalksnis";if(l.startsWith("meln"))return "Melnalksnis";return "Citas sugas";}
function buildMer(){const R=IMP.rows,M=IMP.map;const g=(r,k)=>M[k]!=null?r[M[k]]:"";const out=[];
 for(let i=IMP.hdr+1;i<R.length;i++){const r=R[i];const pl=num(g(r,"platiba"));if(!pl&&!String(g(r,"nogabals")).trim())continue;
  const m=newMer();m.kvartals=String(g(r,"kvartals")).trim();m.nogabals=String(g(r,"nogabals")).trim();m.platKop=pl;m.platMezs=pl;m.veids=String(g(r,"veids")).trim()||"Mežaudze";m.mezaTips=String(g(r,"mezaTips")).trim();
  m.suga=String(g(r,"suga")).trim()?normSp(g(r,"suga")):"";m.vecums=num(g(r,"vecums"));m.H=num(g(r,"H"));m.D=num(g(r,"D"));m.G=num(g(r,"G"));m.krajaImp=num(g(r,"kraja"))||(num(g(r,"krajaHa"))*pl)||null;m.hasCert=M.certamais!=null;m.certamais=num(g(r,"certamais"))||0;m.cirsmaKods=String(g(r,"cirsma")).trim().toUpperCase();m.ierob=String(g(r,"ierob")).trim();m.bon=String(g(r,"bon")).trim();m.pedCirte=[String(g(r,"pedCirte")).trim(),g(r,"pedCirteG")].filter(x=>x&&x!=="0"&&x!==0).join(" ");m.pedDarb=[String(g(r,"pedDarb")).trim(),g(r,"pedDarbG")].filter(x=>x&&x!=="0"&&x!==0).join(" ");m.formulaTxt=String(g(r,"sastavs")).trim();m.src=IMP.src;m.invGads=num(g(r,"invGads"))||null;m.mezaTips=m.mezaTips;
  const sk=String(g(r,"sugukraja")).trim();if(sk){m.sugas={};for(const part of sk.split(";")){const [a,b]=part.split(":");if(a&&num(b))m.sugas[normSp(a)]=(m.sugas[normSp(a)]||0)+num(b);}}
  const kadr=String(g(r,"kadastrs")).trim();if(kadr&&!IMP.kadastrs)IMP.kadastrs=kadr;
  m.formula=parseSastavs(g(r,"sastavs"),g(r,"suga"));if(m.sugas){const tot=Object.values(m.sugas).reduce((a,b)=>a+b,0);if(tot){m.formula=Object.entries(m.sugas).map(([s2,v])=>({s:s2,k:Math.round(v/tot*10)}));if(!m.krajaImp)m.krajaImp=tot;}}out.push(m);}
 return out;}
function impCreate(){const mer=buildMer();if(!mer.length)return toast("Nav nogabalu");const p=newProp();p.name=IMP.name;p.kadastrs=IMP.kadastrs;p.mer=mer;
 const groups={};for(const m of mer){const code=m.cirsmaKods==="KC"?"Kc":m.cirsmaKods==="KKC"?"KKC":null;if(!code)continue;if(/aizliegts/i.test(m.ierob))continue;
  let kr=krajaMer(m);if(code==="KKC"){if(m.hasCert){if(!(m.certamais>0))continue;kr=m.certamais;}else{kr=kkcCertamais(m).m3;if(!kr)continue;}}else if(m.hasCert&&!(m.certamais>0))continue;
  const key=code+"|"+m.kvartals;if(!groups[key]){const c=newCirsma();c.tips=code;c.kvartals=m.kvartals;c.nogabali="";groups[key]=c;}const c=groups[key];
  c.nogabali+=(c.nogabali?";":"")+m.nogabals;m.cirsma=c.id;}
 p.cirsmas=Object.values(groups);for(const c of p.cirsmas)rebuildCirsma(c,mer.filter(m=>m.cirsma===c.id));S.props.unshift(p);S.cur=p.id;S.view="cirs";S.settings.impMap=IMP.map;IMP={rows:[],hdr:0,map:{},name:"",kadastrs:"",src:""};save(p.id);toast(`Objekts: ${mer.length} nogabali, ${p.cirsmas.length} cirsmas`);}

/* ---------- PDF PARSERS (VMD formāti) ---------- */
const CANON=["kadastrs","kvartāls","nogabals","platība","veids","meža_tips","formula","suga","vecums","augstums","caurmērs","šķērslaukums","kraja_ha","krāja","sugu_krāja","cirsma","ierobežojumi","pēd_cirte","inv_gads","bonitāte"];
const SPC={P:"Priede",E:"Egle",B:"Bērzs",A:"Apse",Ap:"Apse",M:"Melnalksnis",Ma:"Melnalksnis",Ba:"Baltalksnis",Oz:"Ozols",Os:"Osis",K:"Citas sugas",L:"Citas sugas",Bl:"Citas sugas",Ie:"Citas sugas",Kr:"Citas sugas"};
const BON="(Ia|I|II|III|IV|V|Va)";
const VEIDI_RE="(Mežaudze|Izcirtums|Lauce|Purvs|Zāļu_purvs|Sūnu_purvs|Bebru_appl\\S*|Meža\\s+dzīvnieku[^\\d]*?lauce|[A-ZĀČĒĢĪĶĻŅŠŪŽ][^\\d]{2,40}?)";
function parsePdfLines(lines){ // lines: array of strings (cells joined by single space)
 const txt=lines.join("\n");
 if(/Nogabalu raksturojošie rādītāji/.test(txt))return parseFormatA(lines);
 if(/INVENTARIZĀCIJAS DATI/.test(txt)||/\d+ st\.-/.test(txt))return parseFormatB(lines);
 return null;}
function cirtmetsKC(sp,age,bon){const t={Priede:/^(Ia|I|II|III)$/.test(bon)?101:121,Egle:81,Bērzs:/^(Ia|I|II|III)$/.test(bon)?71:51,Melnalksnis:71,Apse:41,Ozols:101,Osis:81};return t[sp]&&age>=t[sp]?"KC":"";}
function firstSp(formula){const m=String(formula).match(/\d+\s*(Ba|Ma|Ap|Oz|Os|Bl|Ie|Kr|P|E|B|A|M|K|L)/);return m?SPC[m[1]]:"";}
/* Formāts A: "Nogabalu raksturojošie rādītāji" (MVR izdruka) */
function parseFormatA(lines){const recs=[];let kad="",propKad="",kv="",inv="",cur=null,buf=null;
 const tail=/^(.*?)\s+([DM])\s+(Ia|I|II|III|IV|V|Va)\s+((?:\d+\s+){3,6}\d+)$/;
 const head=/^(\d+)\s+(\d+(?:\.\d+)?)\s+(.*)$/;
 const push=r=>{recs.push(r);};
 for(let raw of lines){const l=raw.replace(/\s+/g," ").trim();if(!l)continue;
  let m;if((m=l.match(/(?:Īpašuma kadastra apzīmējums|Zemes vienības apzīmējums)-\s*(\d{11})/))){kad=m[1];propKad=m[1];}else if(!propKad&&(m=l.match(/Zemes vienība (\d{11})/))){kad=m[1];}if((m=l.match(/inv\. veikta (\d{4})/)))inv=m[1];
  if((m=l.match(/^(\d+)\. kvartāls$/))){kv=m[1];continue;}
  if(/^(Kvartāls\/|nogabals|Kopā platība|Pavisam kopā|Platību sadalījums|Zemes vienība:|\d{11} \d\d\.\d\d\.\d{4})/.test(l))continue;
  if(cur&&/^Pēdējais cirtes/.test(l)){cur["pēd_cirte"]=l.replace(/^Pēdējais cirtes izpildes veids un gads:\s*/,"");continue;}
  if(cur&&/^(Aizs\.paz|Īpatnības|2\. stāvs|SSIZC|Atjaunots|Ieaudzēts|Plantācijas|Nepieciešamais|Pēdējais darbības)/.test(l)){if(/^(Aizs|Īpatn)/.test(l))cur["ierobežojumi"]=((cur["ierobežojumi"]||"")+" "+l).trim().slice(0,200);continue;}
  if(buf){const t=(buf.rest+" "+l);const mt=t.match(tail);if(mt){finishA(buf,mt);push(buf);cur=buf;buf=null;}else{buf.rest=t;}continue;}
  if((m=l.match(head))){const r={kadastrs:kad,"kvartāls":kv,nogabals:m[1],"platība":m[2],inv_gads:inv};const rest=m[3];
   const mv=rest.match(/^(Mežaudze|Izcirtums)\s+(\S+)\s+(.*)$/);
   if(!mv){r.veids=rest.replace(/\s+/g," ");push(r);cur=r;continue;}
   r.veids=mv[1];r["meža_tips"]=mv[2];const mt=mv[3].match(tail);
   if(mt){finishA(r,mt);push(r);cur=r;}else{buf=r;buf.rest=mv[3];}
   continue;}
  if(cur&&/^(Aizsargjoslas|Ūdenstilpju)/.test(l))cur["ierobežojumi"]=((cur["ierobežojumi"]||"")+" "+l).trim().slice(0,200);
 }
 return [CANON.slice(),...recs.map(r=>CANON.map(k=>r[k]??""))];}
function finishA(r,mt){r.formula=mt[1].trim();r.suga=firstSp(r.formula);const bon=mt[3];const n=mt[4].trim().split(/\s+/).map(Number);
 r.augstums=n[0];r["caurmērs"]=n[1];r.vecums=n[2];const tailn=n.slice(4),kr=n[n.length-1];r.kraja_ha=kr;
 for(const x of tailn.slice(0,-1)){if(x>=100)r.koki=x;else r["šķērslaukums"]=x;}
 r["krāja"]=Math.round(kr*parseFloat(r["platība"]));r.cirsma=cirtmetsKC(r.suga,r.vecums,bon);r["bonitāte"]=bon;}
/* Formāts B: "INVENTARIZĀCIJAS DATI" (vecākā taksācijas izdruka, krāja pa sugām) */
function parseFormatB(lines){const rows=[CANON.slice()];let kad="",kv="",inv="",cur=null;const seen=new Set();
 const main=/^(\d+)\s+(\d+\.\d+)\s+(\S+)\s+1 st\.-(.+?)\s+([DM])\s+(\S+)\s+(Ia|I|II|III|IV|V|Va)\s+(\d+)\s+(\d+)\s+(\d+)(?:\s+(\d+))?\s+([A-Z][a-z]?)\s*(\d+)\s+(\d+)/;
 const nonf=/^(\d+)\s+(\d+\.\d+)\s+([^\d\s]\S*)\s*$/;
 const sub=/(?:^|\s)([A-Z][a-z]?)\s*(\d+)\s*$/;
 const push=r=>{rows.push(CANON.map(k=>r[k]??""));};
 const fin=r=>{if(!r)return;const parts=Object.entries(r._sp);r["sugu_krāja"]=parts.map(([s,v])=>s+":"+v).join(";");const tot=parts.reduce((a,[,v])=>a+v,0);r["krāja"]=tot||Math.round(r.kraja_ha*parseFloat(r["platība"]));r.kraja_ha=r.kraja_ha||(tot&&Math.round(tot/parseFloat(r["platība"])));push(r);};
 for(let raw of lines){const l=raw.replace(/\s+/g," ").trim();if(!l)continue;let m;
  if((m=l.match(/(\d+)\.kvartāls\s+(\d{11})\s+(\d{4})\. gada/))){if(kv!==m[1]){fin(cur);cur=null;}kv=m[1];kad=m[2];inv=m[3];continue;}
  if(cur&&(m=l.match(/^(\d+)\s+(?:\S+\s+)?(?:\d+\s+)?([A-Z][a-z]?)\s*(\d+)(?:\s+\d+)?$/))&&m[1]===cur.nogabals&&!/^\d+\s+\d+\.\d+/.test(l)){const s=SPC[m[2]];if(s&&!(s in cur._sp))cur._sp[s]=+m[3];continue;}
  if((m=l.match(main))){const key=kv+"/"+m[1];if(seen.has(key)){continue;}seen.add(key);fin(cur);
   cur={kadastrs:kad,"kvartāls":kv,nogabals:m[1],"platība":m[2],veids:m[3],formula:m[4],"meža_tips":m[6],"bonitāte":m[7],augstums:+m[8],"caurmērs":+m[9],"šķērslaukums":m[11]?+m[11]:"",kraja_ha:+m[14],inv_gads:inv,_sp:{}};
   const ageM=m[4].match(/(\d+)\s*$/);cur.vecums=ageM?+ageM[1]:"";cur.suga=SPC[m[12]]||firstSp(m[4]);cur._sp[SPC[m[12]]||"Citas sugas"]=+m[13];
   cur.cirsma=cirtmetsKC(cur.suga,cur.vecums,m[7]);continue;}
  if((m=l.match(nonf))){const key=kv+"/"+m[1];if(seen.has(key))continue;seen.add(key);fin(cur);cur=null;push({kadastrs:kad,"kvartāls":kv,nogabals:m[1],"platība":m[2],veids:m[3].replace(/_/g," "),inv_gads:inv});continue;}
  if(cur&&/^\d+\s+\d+\.\d+\s/.test(l)){continue;} // cita rinda, ko neatpazinām
  if(cur&&(m=l.match(sub))&&!/^\d{4}$/.test(l)&&!/veikts/.test(l)){const s=SPC[m[1]];if(s){cur._sp[s]=(cur._sp[s]||0)+(+m[2]);}continue;}
  if(cur&&/^(Ūdenstilpju|Aizsargjoslas|aizsarg)/.test(l))cur["ierobežojumi"]=((cur["ierobežojumi"]||"")+" "+l).trim().slice(0,200);
 }
 fin(cur);return rows;}

 h+=`<div class="card scroll"><h2>Kaimiņu svaigie izcirtumi (VMD, pēdējie 3 gadi)</h2>${p.kaimCuts&&p.kaimCuts.length?`<table><tr><th>Kaimiņa ZV</th><th>Kv/nog.</th><th>ha</th><th>Cirte</th><th>Gads</th><th>Atjaunots</th><th>Blakus mūsu nog.</th></tr>${p.kaimCuts.map(k=>`<tr><td>${esc(k.kad)}</td><td>${esc(k.kv)}/${esc(k.nog)}</td><td>${fmt(k.ha,2)}</td><td>${esc(k.cirte)}</td><td>${esc(k.gads)}</td><td>${esc(k.atj)}</td><td>${esc(k.nog_own.join(", "))}</td></tr>`).join("")}</table>`:'<div class="muted">Nav (vai objekts nav no pagasta faila).</div>'}<div class="muted">VMD izsniegtos apliecinājumus publiski vairs nerāda; zināmos ievadi ar roku: <input placeholder="nogabals; cirte; izsniegts DD.MM.GGGG; derīgs līdz" style="max-width:360px" onchange="(P().aplieci=P().aplieci||[]).push({own:true,nog:[this.value.split(';')[0].trim()],veids:(this.value.split(';')[1]||'').trim(),izsn:(this.value.split(';')[2]||'').trim(),derigs:(this.value.split(';')[3]||'').trim(),geom:{type:'Polygon',coordinates:[]},manual:true});this.value='';save(S.cur)"></div></div>`;
 h+=`<div class="card scroll"><h2>Ciršanas apliecinājumi (ievadītie)</h2>${p.aplieci&&p.aplieci.length?`<table><tr><th>Kur</th><th>Nogabali</th><th>Cirte</th><th>Izsniegts</th><th>Derīgs līdz</th><th>ha</th></tr>${p.aplieci.map(a=>`<tr><td>${a.own?"šajā īpašumā":"kaimiņa īpašumā "+esc(a.kad||"")}</td><td>${esc(a.nog.join(", "))}</td><td>${esc(a.veids)}</td><td>${esc(a.izsn)}</td><td>${esc(a.derigs)}</td><td>${esc(a.plat)}</td></tr>`).join("")}</table>`:`<div class="muted">${p.aplieciChecked?"Pārbaudīts "+p.aplieciChecked+": apliecinājumu nav.":"Nav pārbaudīts (dati atjaunojas katru nakti)."}</div>`}</div>`;
 h+=`<div class="card scroll"><h2>Kailcirte pa mitruma grupām</h2><table><tr><th>Grupa</th><th>KC ha</th><th>neto m³</th><th>limits ha/cirsma</th><th>min. cirsmu skaits</th><th>nogabali</th></tr>`;
 for(const mo of ["sausie","slapjie","?"]){const k=r.kc[mo];if(!k.n.length)continue;h+=`<tr><td>${mo==="sausie"?"Sausie (Sl, Mr, Ln, Dm, Vr, Gr)":mo==="slapjie"?"Slapjie, purvāji, āreņi, kūdreņi":"Nav tipa"}</td><td class="${k.limit&&k.ha>k.limit?"pctbad":""}">${fmt(k.ha,2)}</td><td>${fmt(k.m3)}</td><td>${k.limit??"–"}</td><td>${k.minCirsmas??"–"}</td><td style="white-space:normal;text-align:left">${k.n.map(m=>m.nogabals).join(", ")}</td></tr>`;}
 h+=`</table><div class="muted">Neto m³ = krāja mīnus ekoloģiskie koki (${RULES.ecoTreesHa.KC}/ha KC, ${RULES.ecoTreesHa.KKC}/ha kopšanā, ${RULES.ecoTreeM3} m³ koks).</div></div>`;
 if(r.split.length){const pairs=String(p.kaimini||"").split(/[;,]/).map(x=>x.trim().split("-").map(y=>y.trim())).filter(x=>x.length===2);
  h+=`<div class="card scroll"><h2>Cirsmu sadalījuma priekšlikums</h2><table><tr><th>Cirsma</th><th>Nogabali</th><th>ha</th><th>m³</th><th>Piezīme</th></tr>`;
  r.split.forEach((g,i)=>{const conflicts=[];r.split.forEach((g2,j)=>{if(j<=i)return;for(const pr of pairs){if((g.nog.includes(pr[0])&&g2.nog.includes(pr[1]))||(g.nog.includes(pr[1])&&g2.nog.includes(pr[0])))conflicts.push(`robežojas ar cirsmu ${j+1} (nog. ${pr.join("-")})`);}});
   h+=`<tr><td>${i+1} (${g.mo})</td><td style="white-space:normal;text-align:left">${g.nog.join("; ")}</td><td>${fmt(g.ha,2)}</td><td>${fmt(g.m3)}</td><td style="white-space:normal;text-align:left" class="${conflicts.length?"pctbad":""}">${conflicts.join("; ")||"–"}</td></tr>`;});
  h+=`</table><div class="muted">Grupēts pēc lielākās krājas, katra ≤ limits. Robežošanos rīks zina tikai no ierakstītajiem pāriem (nav ģeometrijas). Ja divas cirsmas robežojas, starp tām 90 m josla vai dabisks atdalītājs, vai viena cērtama pēc otras atjaunošanas.</div>${r.buffers.length?`<h3 style="margin:10px 0 4px">${bufM()} m joslas (atlikts uz laiku pēc blakus cirsmas atjaunošanas)</h3><table><tr><th>Pāris</th><th>Robeža m</th><th>Josla paliek nog.</th><th>Cirsma</th><th>ha</th><th>m³ atlikti</th></tr>${r.buffers.map(b=>`<tr><td>${esc(b.a)}-${esc(b.b)}</td><td>${b.L}${b.real?" (ģeometrija)":b.est?" (novērtēts)":""}</td><td>${esc(b.nog)}</td><td>${b.grp}</td><td>${fmt(b.stripHa,2)}</td><td>${fmt(b.m3)}</td></tr>`).join("")}<tr class="tot"><td>KOPĀ</td><td></td><td></td><td></td><td>${fmt(r.deferredHa,2)}</td><td>${fmt(r.deferredM3)}</td></tr></table><div class="muted">Bez garuma robežu novērtē kā mazākā nogabala kvadrāta malu (√(ha × 10 000)); precīzāk: "32-10:200". Joslu liek nogabalā ar mazāku krāju/ha. Katram nogabalam rīks ieraksta buferi % no m³ (Mērījumos labojams; manuāli ievadītu vērtību rīks nepārraksta).</div>`:""}
 <button class="btn amber" style="margin-top:8px" onclick="applySplit()">${ARM==="split"?"Aizstās esošās Kc cirsmas. Spied vēlreiz":"Pārveidot cirsmas pēc šī sadalījuma"}</button></div>`;}
 const flagged=r.nog.filter(x=>x.f.length);
 h+=`<div class="card"><h2>Nogabali ar piezīmēm (${flagged.length})</h2><div class="list">${flagged.map(x=>`<div class="item"><div class="t"><b>${x.m.kvartals?"kv."+esc(x.m.kvartals)+" ":""}nog. ${esc(x.m.nogabals)} · ${esc(x.m.mezaTips)} · ${esc(x.m.suga)} ${x.m.vecums||""}g · ${fmt(x.kr)} m³ (${fmt(x.krha)} m³/ha) ${x.m.cirsmaKods?"· "+x.m.cirsmaKods:""}</b><small>${x.f.map(f=>`<span class="${f.t==="bloks"?"pctbad":""}">${esc(f.s)}</span>`).join(" · ")}</small></div></div>`).join("")||'<div class="empty">Piezīmju nav.</div>'}</div></div>`;
 const realistic=r.nog.filter(x=>x.m.cirsmaKods&&!x.exclude);const rm3=realistic.reduce((a,x)=>a+Math.max(x.kr-x.eco,0),0),rha=realistic.reduce((a,x)=>a+num(x.m.platMezs||x.m.platKop),0);
 h+=`<div class="card"><h2>Realistiskais apjoms</h2><div class="kv"><span>Pēc ekonomiskā filtra un bloķētāju izslēgšanas</span><b>${fmt(rha,2)} ha · ${fmt(rm3)} m³</b></div><div class="kv"><span>Visi nogabali ar cirsmas kodu</span><b>${fmt(r.nog.filter(x=>x.m.cirsmaKods).reduce((a,x)=>a+num(x.m.platMezs||x.m.platKop),0),2)} ha · ${fmt(r.nog.filter(x=>x.m.cirsmaKods).reduce((a,x)=>a+Math.max(x.kr-x.eco,0),0))} m³</b></div></div>`;
 h+=`<div class="card"><h2>Pirms iesnieguma</h2>${PRECHECK.map(t=>`<div class="kv"><span>${esc(t)}</span></div>`).join("")}</div>`;
 return h;}
function cirsmaLegal(c){const p=P();const linked=p.mer.filter(m=>m.cirsma===c.id);if(!linked.length)return "";const r=runChecks(p);const rows=r.nog.filter(x=>linked.includes(x.m));
 const groups={};for(const x of rows)groups[x.mo]=(groups[x.mo]||0)+num(x.m.platMezs||x.m.platKop);const zone=RULES.iadt[p.iadt||""];let h=`<div class="species" style="border-top-color:var(--amber)"><h3>Likumdošana šai cirsmai</h3>`;
 if(c.tips==="Kc"){if(!zone.kc)h+=`<div class="kv"><span class="pctbad">KC aizliegta izvēlētajā ĪADT zonā</span></div>`;
  for(const mo in groups){const lim=zone.limit!==null?zone.limit:RULES.kcLimitHa[mo==="sausie"?"sausie":"slapjie"];const over=groups[mo]>lim+1e-9;h+=`<div class="kv"><span>${mo==="sausie"?"Sausie tipi":mo==="slapjie"?"Slapjie / purvāji / āreņi / kūdreņi":"Bez meža tipa"}, limits ${lim} ha</span><b class="${over?"pctbad":""}">${fmt(groups[mo],2)} ha ${over?"pārsniedz, jādala":"✓"}</b></div>`;}
  if(Object.keys(groups).length>1){const wet=groups["slapjie"]||0,tot=Object.values(groups).reduce((a,b)=>a+b,0);h+=`<div class="kv"><span>Jaukta cirsma (MK935 16.p.): kopā ≤ 5 ha, slapjā daļa ≤ 2 ha</span><b class="${(tot>5||wet>2)?"pctbad":""}">${fmt(tot,2)} ha, slapjie ${fmt(wet,2)} ha ${(tot>5||wet>2)?"pārsniedz":"✓"}</b></div>`;}}
 if(c.tips==="KKC"){const kr=rows.reduce((a,x)=>a+x.kr,0),ce=rows.reduce((a,x)=>a+(x.m.certamais||0),0);if(kr&&ce)h+=`<div class="kv"><span>Kopšanas intensitāte (cērtamais / krāja)</span><b class="${ce/kr*100>=RULES.maxThinPct?"pctbad":""}">${fmt(ce/kr*100)} %</b></div>`;}
 const eco=rows.reduce((a,x)=>a+x.eco,0);h+=`<div class="kv"><span>Ekoloģiskie koki (${RULES.ecoTreesHa[c.tips==="Kc"?"KC":"KKC"]||0}/ha), atskaitīti</span><b>${fmt(eco)} m³</b></div>`;
 for(const x of rows)for(const f of x.f)h+=`<div class="kv"><span>nog. ${esc(x.m.nogabals)}</span><b class="${f.t==="bloks"?"pctbad":""}" style="text-align:right;white-space:normal;max-width:70%">${esc(f.s)}</b></div>`;
 return h+"</div>";}
function bufferSuggest(p,r){const out={};for(const b of (r||runChecks(p)).buffers){const m=p.mer.find(x=>x.nogabals===b.nog);if(!m)continue;const ha=num(m.platMezs||m.platKop);out[m.id]=Math.min(100,Math.round((out[m.id]||0)+(ha?b.stripHa/ha*100:0)));}return out;}
function applyBuffers(p,r){const sug=bufferSuggest(p,r);for(const m of p.mer){if(m.buferManual)continue;m.buferPct=sug[m.id]||0;}}
function applySplit(){const p=P();const r=runChecks(p);applyBuffers(p,r);if(ARM!=="split"){ARM="split";render();setTimeout(()=>{if(ARM==="split"){ARM=null;render();}},4000);return;}ARM=null;
 p.cirsmas=p.cirsmas.filter(c=>c.tips!=="Kc");
 r.split.forEach((g,i)=>{const c=newCirsma();c.tips="Kc";c.kvartals="";c.nogabali=g.nog.join(";");c.platiba=g.ha;
  for(const x of r.nog){if(!g.nog.some(n=>n===x.m.nogabals||n.startsWith(x.m.nogabals+" (")))continue;const frac=g.nog.includes(x.m.nogabals)?1:(g.nog.some(n=>n.startsWith(x.m.nogabals+" (daļa"))?g.ha/num(x.m.platMezs||x.m.platKop):1-g.ha/num(x.m.platMezs||x.m.platKop));
   x.m.cirsma=c.id;c.kvartals=c.kvartals||x.m.kvartals;}
  p.cirsmas.push(c);rebuildCirsma(c,p.mer.filter(m=>m.cirsma===c.id));});
 S.view="cirs";save(S.cur);toast("Cirsmas pārveidotas");}

/* migrācija: pārrēķina esošos objektus pēc jaunajiem noteikumiem */
const APP_VERSION="0.22";
function migrate(){if(S.migrated===APP_VERSION)return;const cur=S.cur;for(const p of S.props){S.cur=p.id;for(const c of p.cirsmas){const linked=p.mer.filter(m=>m.cirsma===c.id);if(!linked.length)continue;
  for(const m of linked){const bad=(m.hasCert&&!(m.certamais>0))||/aizliegts/i.test(m.ierob||"")||(c.tips==="KKC"&&m.cirsmaKods!=="KKC")||(c.tips==="Kc"&&m.cirsmaKods!=="KC");if(bad)m.cirsma="";}
  const now=p.mer.filter(m=>m.cirsma===c.id);c.nogabali=now.map(m=>m.nogabals).join(";");if(now.length)rebuildCirsma(c,now);}
 p.cirsmas=p.cirsmas.filter(c=>c.nogabali||Object.values(c.species).some(v=>v.m3));}
 S.cur=cur;S.migrated=APP_VERSION;localStorage.setItem(KEY,JSON.stringify(S));}
migrate();
/* boot */
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
document.getElementById("ver").textContent="v"+APP_VERSION;
render();
</script>
