input,select,textarea{width:100%;min-height:var(--tap);font:inherit;font-size:1.05rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}

.item .t{flex:1}
.item .t b{display:block}

.pctbad{color:var(--red);font-weight:600}

.pctinfo{color:#4477aa;font-weight:600}

.empty{padding:24px;text-align:center;color:var(--mute)}

.toast.show{opacity:1}

.man input,.man select{border-color:var(--amber);background:#fff8e6}.auto input{border-color:#4477aa;background:#eef3fb}

.lg span i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:middle}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.95rem}

@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (min-width:900px){nav{top:48px} main{padding:20px}}

/* calculations, all deterministic */
function calcCirsma(c){
 let m3=0,rev=0;const bySp={};
 for(const s of SPECIES){const sp=c.species[s];if(!sp)continue;const sm3=num(sp.m3);let val=0,pct=0;
  for(const [sort,price] of S.prices[s]){const p=num(sp.pct[sort]);pct+=p;val+=sm3*p*num(price);}
  bySp[s]={m3:sm3,val,pct,celma:sm3?val/sm3-(num(c.sagat)+num(c.piev)+num(c.trans)):0};m3+=sm3;rev+=val;}
 const costM3=num(c.sagat)+num(c.piev)+num(c.trans),cost=m3*costM3,max=rev*(1-num(c.marza))-cost;
 return {m3,rev,cost,costM3,max,bySp,revM3:m3?rev/m3:0,vidKoks:num(c.koki)?m3/num(c.koki):0,m3ha:num(c.platiba)?m3/num(c.platiba):0};
}
function calcProp(p){const t={m3:0,rev:0,cost:0,max:0,ha:0};for(const c of p.cirsmas){const r=calcCirsma(c);t.m3+=r.m3;t.rev+=r.rev;t.cost+=r.cost;t.max+=r.max;t.ha+=num(c.platiba);}
 const iz=izvedIzmaksas(p);t.izved=iz;t.cost+=iz.cost;t.max-=iz.cost; // #21: izvešanas izmaksas summējas pie pārējām
 return t;}
function krajaMer(m){if(m.krajaImp!=null&&m.krajaImp>0)return num(m.krajaImp);const f=m.f??FORM_FACTOR[m.suga]??.45;return num(m.G)*num(m.H)*f*num(m.platMezs||m.platKop);}
// #45: nogabalu ticamības pārbaude (VMD dbf decimālās kļūdas, piem. ×100) — dzīvs pārbaudījums pret pašreizējo m.G/m.krajaImp, strādā vienādi VMD un xlsx importam
function nogPlausibleIssue(m){const ha=num(m.platMezs||m.platKop);const kr=krajaMer(m),g=num(m.G);
 if(ha<=0)return (kr>0||gExceeds(m.suga,m.H,g))?{krha:null,g,kr}:null; // ha=0 nedrīkst apiet G pārbaudi, un krāja bez platības arī nav ticama
 const krha=kr/ha;if(krha>RULES.maxPlausibleM3Ha||gExceeds(m.suga,m.H,g))return {krha:Math.round(krha),g,kr};return null;}
function plausText(pl){if(pl.krha==null)return `Krāja ${Math.round(pl.kr)} m³ bez derīgas platības, avota kļūda`;
 if(pl.krha>RULES.maxPlausibleM3Ha)return `Krāja ārpus iespējamā (${pl.krha} m³/ha), avota kļūda`;
 return `Šķērslaukums ārpus iespējamā (G=${pl.g}, virs 1,5× normālā pēc MK384), avota kļūda`;}
function krajaMerChecked(m){return nogPlausibleIssue(m)?0:krajaMer(m);} // kopsummām (Pārskats, Fonds, cirsmas): neticamie nogabali = 0, kamēr nav labots
function fixEligible(m){const ha=num(m.platMezs||m.platKop);if(!ha)return false;const kr=krajaMer(m),g=num(m.G),krha=kr/ha;
 if(!(krha>RULES.maxPlausibleM3Ha)||!gExceeds(m.suga,m.H,g))return false; // abi (krāja UN G) jāpārkāpj
 return krha*0.01<=RULES.maxPlausibleM3Ha&&!gExceeds(m.suga,m.H,g*0.01);} // pēc /100 abi jākļūst ticami
function fixByHundred(id){arm("fix1"+id,"",()=>{const m=M(id);if(!fixEligible(m))return;const p=P();const oldKr=Math.round(krajaMer(m)),oldG=m.G;
 const note="labots ×0,01 (avota kļūda) "+new Date().toISOString().slice(0,10);m.man=m.man||{};
 if(m.krajaImp!=null&&m.krajaImp>0){m.krajaImp=+(m.krajaImp*0.01).toFixed(2);m.man.krajaImp=note;}
 m.G=+(num(m.G)*0.01).toFixed(2);m.man.G=note;
 if(m.sugas)for(const s in m.sugas)m.sugas[s]=+(m.sugas[s]*0.01).toFixed(2);
 logIt(p,`nog. ${m.nogabals}: krāja/G labots ×0,01 (${oldKr} m³, G ${oldG} → ${Math.round(krajaMer(m))} m³, G ${m.G})`);
 recalcLinked();save(S.cur);});}
// #46 pabeigšana: bonitāte vispirms no datiem (VMD BON lauks vai Kadastra atskaites kolonna), tikai tad MK384 3.piel.
// tabula pēc H+vecuma (real likuma tabula, nevis aproksimācija); nekad klusi neizvēlas sliekšņa galu.
// src: "data" (no datiem, bez karodziņa), "mk384" (aprēķināts, zils informatīvs), "missing" (trūkst H/vecuma, dzeltens),
// "jauns" (vecums zem tabulas minimuma — pārāk jauns cirtmeta jautājumam, klusi bez karodziņa), "suga" (suga nav MK384 tabulās, sarkans).
function bonOf(m){const b=String(m.bon||"").trim();if(b)return {bon:b,est:false,src:"data"};
 const H=num(m.H),age=Math.round(num(m.vecums));
 if(!H||!num(m.vecums))return {bon:"",est:false,src:"missing"};
 const tk=MK384.SUGA_TAB[m.suga];if(!tk)return {bon:"",est:false,src:"suga"};
 const t=MK384.TAB[tk];if(age<t.min)return {bon:"",est:false,src:"jauns"};
 const row=t.r[Math.min(age,t.max)-t.min];
 return {bon:bonFromRow(row,H),est:true,src:"mk384",tab:tk};}

/* ---------- SYNC ---------- */
function enqueue(id){if(!S.queue.includes(id))S.queue.push(id);}
async function sync(){const {endpoint,token}=S.settings;if(!endpoint||!navigator.onLine||!S.queue.length)return updNet();
 const q=[...S.queue];for(const id of q){const p=S.props.find(x=>x.id===id);try{
  const r=await fetch(endpoint.replace(/\/$/,"")+"/props/"+id,{method:"PUT",headers:{"Content-Type":"application/json",...(token?{"Authorization":"Bearer "+token}:{})},body:JSON.stringify(p||{id,deleted:true})});
  if(!r.ok)throw new Error(r.status);S.queue=S.queue.filter(x=>x!==id);}catch(e){console.warn("sync",e);}}
 localStorage.setItem(KEY,JSON.stringify(S));updNet();}
async function pull(){const {endpoint,token}=S.settings;if(!endpoint)return toast("Nav norādīts servera adrese");try{
 const r=await fetch(endpoint.replace(/\/$/,"")+"/props",{headers:token?{"Authorization":"Bearer "+token}:{}});const list=await r.json();let n=0;
 for(const rp of list){const lp=S.props.find(x=>x.id===rp.id);if(!lp){S.props.push(rp);n++;}else if((rp.updatedAt||0)>(lp.updatedAt||0)&&!S.queue.includes(rp.id)){Object.assign(lp,rp);n++;}}
 save();toast(`Atjaunoti ${n} objekti`);}catch(e){toast("Neizdevās savienoties");}}
function updNet(){const on=navigator.onLine;const np=document.getElementById("netpill");np.textContent=on?"tiešsaistē":"bezsaistē";np.className="pill"+(on?"":" off");
 const pp=document.getElementById("pendpill");pp.hidden=!S.queue.length;pp.textContent=S.queue.length+" gaida";}
addEventListener("error",e=>toast("Kļūda: "+(e.message||"").slice(0,80)));
addEventListener("online",()=>{updNet();sync();});addEventListener("offline",updNet);
setInterval(sync,60000);

 const filt=S.props.filter(p=>(!S.q||hay(p).includes(S.q.toLowerCase()))&&(S.qs==="Arhīvs"?p.archived:(!p.archived&&(!S.qs||(p.status||"Vērtēšanā")===S.qs))));

 return newObjCard()+`<div class="card"><h2>Objekti <span class="sp"></span><button class="btn sm sec" onclick="S.view='imp';save()">Importēt</button><button class="btn sm" onclick="addProp()">+ Jauns objekts</button></h2><div class="list">${list||'<div class="empty">Nav objektu. Pievieno pirmo.</div>'}</div></div>`;}

function summaryTable(p,t){if(!p.cirsmas.length)return "";
 const defYear=new Date().getFullYear()+3;

function recalcLinked(){const p=P();if(p.cirsmas.some(c=>c.tips==="Kc"))applyBuffers(p);for(const c of p.cirsmas){const linked=p.mer.filter(m=>m.cirsma===c.id);if(linked.length)rebuildCirsma(c,linked,p);}}
function rebuildCirsma(c,linked,p){c.aizsargM3=0;const _ir=(typeof iadtRulesFor==="function")?iadtRulesFor(p):[];const _eco=_ir.reduce((a,x)=>Math.max(a,x.r.eco||0),0);for(const s of SPECIES)c.species[s].m3=0;c.platiba=0;const acc={};c.bruto=0;c.eko=0;c.zud=0;c.atlikts=0;
 for(const m of linked){let kr=krajaMerChecked(m);if(m.cirsmaKods==="KKC"){if(m.hasCert){if(!(m.certamais>0)){continue;}kr=m.certamais;}else kr=nogPlausibleIssue(m)?0:kkcCertamais(m).m3;}
  if(c.tips==="Kc"&&m.geom&&m.suga!=="Baltalksnis"&&p.infra){try{const Z=zoneFeatures(p);const k=Z?stripHaOf(m,Z.kc):{ha:0};const ha=num(m.platMezs||m.platKop);if(k.ha>0&&ha>0){const cut=kr*k.ha/ha;kr-=cut;c.aizsargM3=(c.aizsargM3||0)+Math.round(cut);}}catch(e){}}const ha=num(m.platMezs||m.platKop);const defFrac=Math.min(1,Math.max(0,num(m.buferPct)/100));c.atlikts=(c.atlikts||0)+kr*defFrac;kr*=(1-defFrac);c.bruto+=kr;
  const eko=S.settings.ekoKoki===false?0:Math.min(kr,Math.max(RULES.ecoTreesHa[m.cirsmaKods==="KKC"?"KKC":"KC"]||0,_eco||0)*ha*RULES.ecoTreeM3);const zud=(kr-eko)*num(S.settings.zudumi)/100;c.eko+=eko;c.zud+=zud;kr=kr-eko-zud;const sh=speciesShares(m);
  for(const s2 in sh){if(!c.species[s2])continue;const v=kr*sh[s2];c.species[s2].m3=num(c.species[s2].m3)+v;const ss=sortSharesForD(s2,m.D);acc[s2]=acc[s2]||{};for(const k in ss)acc[s2][k]=(acc[s2][k]||0)+v*ss[k];}
  c.platiba=+(num(c.platiba)+num(m.platMezs||m.platKop)).toFixed(2);}
 for(const s2 in acc){const tot=Object.values(acc[s2]).reduce((a,b)=>a+b,0);c.species[s2].m3=Math.round(c.species[s2].m3);if(tot&&!c.species[s2].manual){for(const k in acc[s2])c.species[s2].pct[k]=+(acc[s2][k]/tot).toFixed(3);}}}
function ff(id,i,k,v){M(id).formula[i][k]=k==="k"?num(v):v;recalcLinked();save(S.cur);}
function fadd(id){M(id).formula.push({s:"Egle",k:0});save(S.cur);}
function fdel(id,i){M(id).formula.splice(i,1);save(S.cur);}
function delMer(id){arm("m"+id,"",()=>{P().mer=P().mer.filter(m=>m.id!==id);recalcLinked();save(S.cur);});}
function speciesShares(m){const out={};if(m.sugas){const tot=Object.values(m.sugas).reduce((a,b)=>a+b,0);if(tot){for(const s in m.sugas)out[s]=m.sugas[s]/tot;return out;}}const ks=m.formula.reduce((a,x)=>a+num(x.k),0)||10;for(const f of m.formula)if(f.s)out[f.s]=(out[f.s]||0)+num(f.k)/ks;return out;}

async function cachedFetch(url){try{const c=await caches.open("geo-v1");const hit=await c.match(url);if(hit&&!navigator.onLine)return hit;

async function gunzipJson(resp){const buf=await resp.arrayBuffer();

// Viena krautuve objektam; katram cērtamajam nogabalam efektīvākais (īsākais) ceļš pa ceļu tīklu uz to.
// Algoritms: ceļu segmentu virsotnes = grafa mezgli (LKS-92 metros, Dijkstra ar reālu segmentu garumu);
// nogabala/krautuves piesaiste tīklam = taisna līnija līdz tuvākajam grafa mezglam (nevis punkta projekcija uz šķautnes —
// vienkāršāk un pietiekami precīzi, jo OSM ceļu virsotnes ir biezi izvietotas). Attālums = taisne(centroīds->mezgls) +
// Dijkstra(mezgls->krautuves mezgls) + taisne(krautuves mezgls->krautuve). Kopš SCHEMA_VERSION 2 (#22)/infra pārbūves (#39)
// roads[].geom ir fragmentu saraksts (MultiLineString), tāpēc jāiterē pa rd.geom, ne tieši pa rd.
function roadGraph(roads){
 const nodes=new Map(),adj=new Map();
 const nodeAt=(lon,lat)=>{const [x,y]=wgsToLks(lon,lat);const k=Math.round(x)+","+Math.round(y);if(!nodes.has(k))nodes.set(k,{x,y,lon,lat});return k;};
 const addEdge=(a,b)=>{if(a===b)return;const A=nodes.get(a),B=nodes.get(b);const w=Math.hypot(A.x-B.x,A.y-B.y);
  (adj.get(a)||(adj.set(a,[]),adj.get(a))).push({to:b,w});(adj.get(b)||(adj.set(b,[]),adj.get(b))).push({to:a,w});};
 for(const rd of roads||[])for(const ln of rd.geom||[]){let prev=null;for(const [lo,la] of ln){const k=nodeAt(lo,la);if(prev!=null)addEdge(prev,k);prev=k;}}
 return {nodes,adj};
}
function nearestGraphNode(graph,lon,lat){
 const [x,y]=wgsToLks(lon,lat);let best=null,bestD=Infinity;
 for(const [k,n] of graph.nodes){const d=Math.hypot(n.x-x,n.y-y);if(d<bestD){bestD=d;best=k;}}
 return best?{key:best,d:bestD}:null;
}
function dijkstraPath(graph,fromKey,toKey){ // {dist,path:[{lon,lat},...]} vai null, ja tīkls nav savienots
 if(fromKey===toKey)return {dist:0,path:[graph.nodes.get(fromKey)]};
 const dist=new Map([[fromKey,0]]),prev=new Map(),visited=new Set();
 while(true){
  let u=null,ud=Infinity;for(const [k,d] of dist)if(!visited.has(k)&&d<ud){ud=d;u=k;}
  if(u===null)return null;
  if(u===toKey){const path=[];let c=toKey;while(c!=null){path.unshift(graph.nodes.get(c));c=prev.has(c)?prev.get(c):null;}return {dist:ud,path};}
  visited.add(u);
  for(const e of graph.adj.get(u)||[]){const nd=ud+e.w;if(nd<(dist.has(e.to)?dist.get(e.to):Infinity)){dist.set(e.to,nd);prev.set(e.to,u);}}
 }
}
const KRAUTUVE_PREFER=new Set(["motorway","trunk","primary","secondary","tertiary","unclassified","residential","living_street","road"]); // "loģiskākais": īsts publiskais ceļš, ne track/path, ja tāds ir tuvumā
function krautuveAuto(p){ // tuvākais/loģiskākais publiskā ceļa pieslēgums objekta robežas tuvumā
 const roads=(p.infra&&p.infra.roads)||[];if(!roads.length)return null;
 const boundary=p.mer.filter(m=>m.geom).flatMap(m=>outerRingOf(m.geom));if(!boundary.length)return null;
 const boundaryLKS=boundary.map(([lo,la])=>{const [x,y]=wgsToLks(lo,la);return {x,y};});
 const findEntry=rs=>{let best=null,bestD=Infinity;
  for(const rd of rs)for(const ln of rd.geom||[])for(const [lo,la] of ln){const [x,y]=wgsToLks(lo,la);
   for(const bp of boundaryLKS){const d=Math.hypot(x-bp.x,y-bp.y);if(d<bestD){bestD=d;best={lon:lo,lat:la};}}}
  return best;};
 const preferred=roads.filter(r=>KRAUTUVE_PREFER.has(r.t));
 return findEntry(preferred.length?preferred:roads);
}
function nogCutM3(m){ // #21: cērtamā apjoms svēršanai — tā pati loģika, ko rebuildCirsma lieto pirms buferjoslu/eko atskaitījumiem
 if(!(m.cirsmaKods==="KC"||m.cirsmaKods==="KKC"))return 0;
 let kr=krajaMerChecked(m);
 if(m.cirsmaKods==="KKC"){if(m.hasCert){if(!(m.certamais>0))return 0;kr=m.certamais;}else kr=nogPlausibleIssue(m)?0:kkcCertamais(m).m3;}
 return kr>0?kr:0;
}
function izvedNogabali(p){ // cērtamie nogabali: tikai tie, kas jau grupēti kādā cirsmā (izlaisti pēc bloķēšanas jau tur)
 const out=[];
 for(const c of p.cirsmas)for(const m of p.mer)if(m.cirsma===c.id&&m.geom){const m3=nogCutM3(m);if(m3>0)out.push({m,m3});}
 return out;
}
function izvedCalc(p){ // {ok,reason} vai {ok:true,avgDist,totalM3,byNog:[{m,m3,dist,path}],krautuve,krNode}
 const weighted=izvedNogabali(p);
 if(!weighted.length)return {ok:false,reason:"nav cērtamu nogabalu"};
 const kraut=p.krautuve;
 if(!kraut)return {ok:false,reason:"krautuve nav norādīta"};
 const roads=(p.infra&&p.infra.roads)||[];
 if(!roads.length)return {ok:false,reason:"infrastruktūras (ceļu) dati nav ielādēti"};
 const graph=roadGraph(roads);
 if(!graph.nodes.size)return {ok:false,reason:"infrastruktūras (ceļu) dati tukši"};
 const krNode=nearestGraphNode(graph,kraut.lon,kraut.lat);
 let sumWd=0,sumW=0;const byNog=[];
 for(const {m,m3} of weighted){
  let c;try{c=turf.centroid(merFeature(m)).geometry.coordinates;}catch(e){continue;}
  const stNode=nearestGraphNode(graph,c[0],c[1]);
  let dist=null,path=null;
  if(stNode&&krNode){const dp=dijkstraPath(graph,stNode.key,krNode.key);
   if(dp){dist=stNode.d+dp.dist+krNode.d;path=[{lon:c[0],lat:c[1]},...dp.path,{lon:kraut.lon,lat:kraut.lat}];}}
  if(dist==null){ // ceļu tīkls nav savienots šai daļai -> taisnas līnijas tuvinājums
   const [cx,cy]=wgsToLks(c[0],c[1]),[kx,ky]=wgsToLks(kraut.lon,kraut.lat);
   dist=Math.hypot(cx-kx,cy-ky);path=[{lon:c[0],lat:c[1]},{lon:kraut.lon,lat:kraut.lat}];
  }
  byNog.push({m,m3,dist,path});sumWd+=dist*m3;sumW+=m3;
 }
 if(!sumW)return {ok:false,reason:"nav cērtamu nogabalu"};
 return {ok:true,avgDist:sumWd/sumW,totalM3:sumW,byNog,krautuve:kraut};
}
function izvedIzmaksas(p){ // izmaksu formula: bāzes likme + max(0,vidējais−bāzes)/100 × papildu likme, × cērtamais m³
 const s=S.settings,base=num(s.izvedBase!=null?s.izvedBase:6),extra=num(s.izvedExtra!=null?s.izvedExtra:.25),baseDist=num(s.izvedBaseDist!=null?s.izvedBaseDist:300);
 const r=izvedCalc(p);
 if(!r.ok)return {ok:false,reason:r.reason,costM3:0,cost:0,avgDist:null};
 const costM3=base+Math.max(0,r.avgDist-baseDist)/100*extra;
 return {ok:true,costM3,cost:costM3*r.totalM3,avgDist:r.avgDist,totalM3:r.totalM3,byNog:r.byNog};
}

function lksTiles(p){const t=new Set();for(const m of p.mer)if(m.geom)for(const [lo,la] of outerRingOf(m.geom)){const [x,y]=wgsToLks(lo,la);t.add(`${Math.floor(x/10000)}_${Math.floor(y/10000)}`);}return [...t];}
function aplProp(props,re){for(const k in props)if(re.test(k))return props[k];return "";}
function aplDate(v){if(!v)return "";if(typeof v==="number"){const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString("lv-LV");}return String(v);}
async function loadAplieci(p){if(typeof turf==="undefined")return 0;const tiles=lksTiles(p);p.aplieci=[];const seen=new Set();
 const own=p.mer.filter(m=>m.geom).map(m=>({m,f:merFeature(m)}));if(!own.length)return 0;
 const hull=turf.buffer(turf.union(turf.featureCollection(own.map(o=>o.f)))||own[0].f,0.05,{units:"kilometers"});
 for(const t of tiles){let fc;try{const r=await cachedFetch(`${geoBase()}/aplieci/${t}.json`);if(!r.ok)continue;fc=await r.json();}catch(e){continue;}
  for(const f of fc.features||[]){try{if(!turf.booleanIntersects(f,hull))continue;
    const key=JSON.stringify([f.properties,(f.geometry.coordinates+"").slice(0,40)]);if(seen.has(key))continue;seen.add(key);
    const hitNog=own.filter(o=>{try{const i=turf.intersect(turf.featureCollection([f,o.f]));return i&&turf.area(i)>100;}catch(e){return false;}}).map(o=>o.m.nogabals);
    const pr=f.properties||{};p.aplieci.push({own:hitNog.length>0,nog:hitNog,nr:aplProp(pr,/nr|numur|number/i),veids:aplProp(pr,/cirt.*veid|veid/i),izsn:aplDate(aplProp(pr,/izsn|issue|datum|date/i)),derigs:aplDate(aplProp(pr,/der[iī]g|valid|l[iī]dz|expir/i)),plat:aplProp(pr,/plat|area/i),kad:aplProp(pr,/kadastr|kad_/i),geom:f.geometry,props:pr});}catch(e){}}}
 p.aplieciChecked=new Date().toISOString().slice(0,10);return p.aplieci.length;}

// Liepa (1996) stumbra tilpuma formula: V = ψ · H^α · D^(β·lg H + γ), D cm, H m, V m³. Koeficienti rediģējami sadaļā Cenas.
const DEFAULT_LIEPA={Priede:[1.6541e-4,.56582,.25924,1.59689],Egle:[2.3106e-4,.78193,.34175,1.18811],Bērzs:[0.9090e-4,.71677,.16692,1.75701],
 Apse:[0.5093e-4,.92924,.02176,1.90093],Melnalksnis:[0.7950e-4,.81295,.06935,1.85346],Baltalksnis:[0.7433e-4,.81295,.06935,1.85346],
 Ozols:[1.3465e-4,.68120,.14550,1.68325],Osis:[1.3465e-4,.68120,.14550,1.68325],"Citas sugas":[0.9090e-4,.71677,.16692,1.75701]};
function treeVol(sp,D,H){const k=(S.liepa||DEFAULT_LIEPA)[sp]||DEFAULT_LIEPA["Citas sugas"];if(!(D>0&&H>0))return 0;return k[0]*Math.pow(H,k[1])*Math.pow(D,k[2]*Math.log10(H)+k[3]);}
// standarta augstuma līkne, ja dastojumā H nav: H(D) = Hvid·(D/Dvid)^0.35 (tuvinājums)
function hCurve(D,Hv,Dv){return Hv&&Dv?Hv*Math.pow(D/Dv,0.35):Hv||0;}
/* tally: [{sp, D, H, n, malka}] ; malka = koki, kas marķēti kā malka */
function tallyCalc(tally,ctx){const out={};let m3=0,n=0;const acc={};
 for(const t of tally){const sp=t.sp||ctx.sp||"Citas sugas";const H=t.H||hCurve(t.D,ctx.H,ctx.D);const v=treeVol(sp,t.D,H);const cnt=num(t.n);if(!cnt)continue;
  out[sp]=out[sp]||{m3:0,n:0,dSum:0};out[sp].m3+=v*cnt;out[sp].n+=cnt;out[sp].dSum+=t.D*cnt;m3+=v*cnt;n+=cnt;
  const ss=t.malka?{"Malka":1}:sortSharesForD(sp,t.D);acc[sp]=acc[sp]||{};for(const k in ss)acc[sp][k]=(acc[sp][k]||0)+v*cnt*ss[k];}
 const pct={};for(const sp in acc){const tot=Object.values(acc[sp]).reduce((a,b)=>a+b,0)||1;pct[sp]={};for(const k in acc[sp])pct[sp][k]=+(acc[sp][k]/tot).toFixed(3);}
 return {bySp:out,pct,m3,n,dMean:n?Object.values(out).reduce((a,x)=>a+x.dSum,0)/n:0};}
function applyTally(cid,tally,src){const c=C(cid);const linked=P().mer.filter(m=>m.cirsma===cid);const lead=linked[0]||{};
 const r=tallyCalc(tally,{sp:lead.suga,H:num(lead.H),D:num(lead.D)});if(!r.n)return toast("Dastojumā nav koku");
 for(const sp of SPECIES){c.species[sp].m3=0;}for(const sp in r.bySp){if(!c.species[sp])continue;c.species[sp].m3=Math.round(r.bySp[sp].m3);c.species[sp].manual=true;for(const k in c.species[sp].pct)c.species[sp].pct[k]=0;for(const k in r.pct[sp])c.species[sp].pct[k]=r.pct[sp][k];}
 for(const m of linked)m.cirsma="";c.dast={tally,n:r.n,m3:+r.m3.toFixed(2),dMean:+r.dMean.toFixed(1),src,date:new Date().toISOString().slice(0,10)};c.koki=r.n;c.bruto=r.m3;c.eko=0;c.zud=0;c.atlikts=0;
 P().updatedAt=Date.now();save(S.cur);toast(`Dastojums: ${r.n} koki, ${fmt(r.m3)} m³, vid. D ${r.dMean.toFixed(1)} cm`);}

function parseTallyRows(rows){ // tabula: kolonnas suga, D, H, skaits [, malka]

const AGE_GROUPS=[["Jaunaudze (<20 g)",0,19],["Vidēja (20-40)",20,40],["Briestaudze (41-60)",41,60],["Pieaugusi (61-80)",61,80],["Pāraugusi (>80)",81,999]];
function fundStats(props){props=props.filter(p=>!p.archived); // #44: arhivēti objekti neskaita Fondā
 const st={n:props.length,ha:0,mezHa:0,kraja:0,cut:0,max:0,ni:0,sp:{},age:{},land:{sausie:0,slapjie:0,purvi:0,liz:0,krum:0,nev:0},objs:[]};
 for(const p of props){const t=calcProp(p);const c=valCalc(p);let ha=0,mez=0,kr=0;
  for(const m of p.mer){const a=num(m.platKop);ha+=a;const k=krajaMerChecked(m);const mt=m.mezaTips||"";
   if(m.suga||num(m.krajaImp)){mez+=num(m.platMezs||m.platKop);kr+=k;const sh=speciesShares(m);for(const s in sh)st.sp[s]=(st.sp[s]||0)+k*sh[s];
    const ag=AGE_GROUPS.find(g=>num(m.vecums)>=g[1]&&num(m.vecums)<=g[2])||AGE_GROUPS[0];st.age[ag[0]]=(st.age[ag[0]]||0)+num(m.platMezs||m.platKop);
    if(/purv|Niedr|Dumbr|Liek/i.test(mt))st.land.purvi+=a;else if(isDry(mt))st.land.sausie+=a;else st.land.slapjie+=a;}
   else{if(/krūm/i.test(m.veids))st.land.krum+=a;else if(/purv|bebr|appl/i.test(m.veids+mt))st.land.purvi+=a;else st.land.nev+=a;}}
  const v=valOf(p);st.land.liz+=num(v.ha.lizB)+num(v.ha.lizP);
  st.ha+=ha;st.mezHa+=mez;st.kraja+=kr;st.cut+=t.m3;st.max+=t.max;st.ni+=c.mezsSale+c.lizSale+c.krumSale;
  st.objs.push({p,ha,mez,kr,cut:t.m3,max:t.max,ni:c.mezsSale+c.lizSale+c.krumSale,irr:c.irr,status:p.status||"Vērtēšanā",price:num(p.dealPrice)});}
 return st;}

 h+=`<div class="card scroll"><h2>Objekti</h2><table><tr><th style="text-align:left">Objekts</th><th>Statuss</th><th>ha</th><th>Mežs ha</th><th>Krāja m³</th><th>Cērtamais</th><th>Cirsmas €</th><th>NĪ €</th><th>IRR</th><th>Cena €</th></tr>${st.objs.map(o=>`<tr style="cursor:pointer" onclick="openProp('${o.p.id}','dash')"><td style="text-align:left">${esc(o.p.name||zvStr(o.p))}<br><span class="muted">${esc(zvStr(o.p))}</span></td><td>${esc(o.status)}</td><td>${fmt(o.ha,1)}</td><td>${fmt(o.mez,1)}</td><td>${fmt(o.kr)}</td><td>${fmt(o.cut)}</td><td>${fmt(o.max)}</td><td>${fmt(o.ni)}</td><td>${o.irr==null?"–":fmt(o.irr*100)+"%"}</td><td>${o.price?fmt(o.price):""}</td></tr>`).join("")}</table></div>`;

// #44: iet cauri VISĀM objekta ZV (var būt vairākos pagastu failos); katras ZV nogabali sakrīt tikai ar TĀS ZV stendiem (m.zv), lai kvartāla/nogabala numerācija nesajauktos starp ZV
async function attachGeometry(pid){const p=S.props.find(x=>x.id===pid)||P();
 const zvList=((p.zv&&p.zv.length?p.zv:(p.kadastrs?[p.kadastrs]:[]))).filter(k=>String(k).replace(/\D/g,"").length===11);
 if(!zvList.length)return toast("Objektam nav derīga kadastra numura (ievadi objekta kartītē)");
 toast("Ielādē ģeometriju no VMD...");
 let hit=0,miss=[],kaimCuts=[];p.lad=null;p.expl=null;p.kaimini="";p.kaimZV=[];p.lielie=[];p.ownersOwn=[];p.dapList=[];
 const byPagasts={};for(const kad of zvList)(byPagasts[kad.slice(0,4)]=byPagasts[kad.slice(0,4)]||[]).push(kad);
 for(const pagCode in byPagasts){
  let data;try{data=await loadPagasts(pagCode);}catch(e){toast("Pagasta fails "+pagCode+" nav pieejams: "+e.message);continue;}
  for(const kad of byPagasts[pagCode]){
   const zvd=data.zv&&data.zv[kad];if(!zvd){toast("Kadastrs "+kad+" atvērtajos datos nav atrasts");continue;}
   const key=x=>String(x.kv??"")+"|"+String(x.nog??"")+((x.anog&&String(x.anog)!=="0")?"."+x.anog:"");
   const byKey={};for(const st of zvd.stands)byKey[key(st)]=st;
   const one=new Set(zvd.stands.map(x=>String(x.kv))).size===1;
   for(const m of p.mer.filter(m=>m.zv===kad||(!m.zv&&zvList.length===1))){const k1=String(m.kvartals||"")+"|"+String(m.nogabals||"");let st=byKey[k1];
    if(!st&&one){st=zvd.stands.find(x=>String(x.nog)+((x.anog&&String(x.anog)!=="0")?"."+x.anog:"")===String(m.nogabals));}
    if(st){m.geom=st.geom;if(!m.zv)m.zv=kad;hit++;if(!m.mezaTips&&st.mt)m.mezaTips=MT_CODES[num(st.mt)]||m.mezaTips;}else miss.push((zvList.length>1?kad+" ":"")+m.nogabals);}
   const {extra}=pagastsToExtra(kad,zvd);
   if(extra.adjacency.length){const lbl=extra.adjacency.map(x=>x.a+"-"+x.b+":"+x.len_m).join("; ");p.kaimini=(p.kaimini?p.kaimini+"; ":"")+lbl;} // #22: atslēga vienmēr zv/kv/nog
   p.lad=sumLadExpl(p.lad,extra.lad);p.expl=sumLadExpl(p.expl,extra.expl);if(!p.ni&&extra.ni)p.ni=extra.ni;
   if(extra.kaimZV.length)p.kaimZV=p.kaimZV.concat(extra.kaimZV);
   if(extra.lielie.length)p.lielie=p.lielie.concat(extra.lielie);
   if(extra.owners.length)p.ownersOwn=p.ownersOwn.concat(extra.owners);
   if(extra.protected.length)p.dapList=p.dapList.concat(extra.protected.map(x=>({kind:x.kind,name:x.name,zone:x.zone,ha:x.overlap_ha})));
   p.geoUpdated=data.updated;}
  try{kaimCuts=kaimCuts.concat(neighbourCuts(data,zvList,p));}catch(e){}}
 p.iadtInfo=p.dapList.map(x=>x.kind+": "+x.name+(x.zone?" ("+x.zone+")":"")+" "+x.ha+" ha").join("; ");p.kaimCuts=kaimCuts;
 loadInfra(p).catch(e=>console.warn("infra",e));logIt(p,`ģeometrija pievienota: ${hit} nogabali${miss.length?", nav atrasti: "+miss.join(", "):""}`);save(S.cur);
 toast(`Ģeometrija: ${hit} nogabali${miss.length?", nav atrasti "+miss.length+" ("+miss.slice(0,6).join(", ")+")":""}`);}

function unionRings(mers){ // apvieno nogabalu ģeometrijas ar turf, atgriež LKS-92 gredzenu(s) (ieskaitot caurumus, #22)
 const feats=mers.filter(m=>m.geom).map(m=>merFeature(m));
 if(!feats.length)return null;let u=feats[0];
 try{for(let i=1;i<feats.length;i++)u=turf.union(turf.featureCollection([u,feats[i]]))||u;}catch(e){console.warn(e);}
 const g=u.geometry;const rings=g.type==="MultiPolygon"?g.coordinates.flatMap(c=>c):g.coordinates;
 return rings.map(r=>r.map(([lo,la])=>wgsToLks(lo,la)));}
function skiceHtml(c){const p=P();const linked=p.mer.filter(m=>m.cirsma===c.id&&m.geom);if(!linked.length)return null;
 const rings=unionRings(linked);if(!rings)return null;
 const all=rings.flat();const xs=all.map(a=>a[0]),ys=all.map(a=>a[1]);
 const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
 const scale=(S.settings.skiceScale||5000);const wm=0.17*scale,hm=0.20*scale; // ~17×20 cm kartes lauks
 const ctx=p.mer.filter(m=>m.geom&&m.cirsma!==c.id).map(m=>({r:outerRingOf(m.geom).map(([lo,la])=>wgsToLks(lo,la)),n:m.nogabals}));

async function readPdf(f){if(!window.pdfjsLib)throw new Error("pdf.js nav ielādēts");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
 const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;const rows=[];
 for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();const lines={};
  for(const it of tc.items){if(!it.str.trim())continue;const y=Math.round(it.transform[5]/3)*3;(lines[y]=lines[y]||[]).push({x:it.transform[4],s:it.str.trim()});}

/* ---------- PDF PARSERS (VMD formāti) ---------- */
const CANON=["kadastrs","kvartāls","nogabals","platība","veids","meža_tips","formula","suga","vecums","augstums","caurmērs","šķērslaukums","kraja_ha","krāja","sugu_krāja","cirsma","ierobežojumi","pēd_cirte","inv_gads","bonitāte"];
const SPC={P:"Priede",E:"Egle",B:"Bērzs",A:"Apse",Ap:"Apse",M:"Melnalksnis",Ma:"Melnalksnis",Ba:"Baltalksnis",Oz:"Ozols",Os:"Osis",K:"Citas sugas",L:"Citas sugas",Bl:"Citas sugas",Ie:"Citas sugas",Kr:"Citas sugas"};
const BON="(Ia|I|II|III|IV|V|Va)";
const VEIDI_RE="(Mežaudze|Izcirtums|Lauce|Purvs|Zāļu_purvs|Sūnu_purvs|Bebru_appl\\S*|Meža\\s+dzīvnieku[^\\d]*?lauce|[A-ZĀČĒĢĪĶĻŅŠŪŽ][^\\d]{2,40}?)";
function parsePdfLines(lines){ // lines: array of strings (cells joined by single space)
 const txt=lines.join("\n");
 if(/Nogabalu raksturojošie rādītāji/.test(txt))return parseFormatA(lines);
 if(/INVENTARIZĀCIJAS DATI/.test(txt)||/\d+ st\.-/.test(txt))return parseFormatB(lines);
 return null;}
// #46: bez bonitātes cirtmetu NENOSAKA (agrāk tukšs bon klusi deva Priedei 121 g, Bērzam 51 g — sk. #46)
function cirtmetsKC(sp,age,bon){const b=String(bon||"").trim();if(!b)return "";
 const t={Priede:/^(Ia|I|II|III)$/.test(b)?101:121,Egle:81,Bērzs:/^(Ia|I|II|III)$/.test(b)?71:51,Melnalksnis:71,Apse:41,Ozols:101,Osis:81};return t[sp]&&age>=t[sp]?"KC":"";}
function firstSp(formula){const m=String(formula).match(/\d+\s*(Ba|Ma|Ap|Oz|Os|Bl|Ie|Kr|P|E|B|A|M|K|L)/);return m?SPC[m[1]]:"";}
/* Formāts A: "Nogabalu raksturojošie rādītāji" (MVR izdruka) */
function parseFormatA(lines){const recs=[];let kad="",propKad="",kv="",inv="",cur=null,buf=null;
 const tail=/^(.*?)\s+([DM])\s+(Ia|I|II|III|IV|V|Va)\s+((?:\d+\s+){3,6}\d+)$/;
 const head=/^(\d+)\s+(\d+(?:\.\d+)?)\s+(.*)$/;
 const push=r=>{recs.push(r);};
 for(let raw of lines){const l=raw.replace(/\s+/g," ").trim();if(!l)continue;
  let m;if((m=l.match(/(?:Īpašuma kadastra apzīmējums|Zemes vienības apzīmējums)-\s*(\d{11})/))){kad=m[1];propKad=m[1];}else if(!propKad&&(m=l.match(/Zemes vienība (\d{11})/))){kad=m[1];}if((m=l.match(/inv\. veikta (\d{4})/)))inv=m[1];
  if((m=l.match(/^(\d+)\. kvartāls$/))){kv=m[1];continue;}
  if(/^(Kvartāls\/|nogabals|Kopā platība|Pavisam kopā|Platību sadalījums|Zemes vienība:|\d{11} \d\d\.\d\d\.\d{4})/.test(l))continue;
  if(cur&&/^Pēdējais cirtes/.test(l)){cur["pēd_cirte"]=l.replace(/^Pēdējais cirtes izpildes veids un gads:\s*/,"");continue;}
  if(cur&&/^(Aizs\.paz|Īpatnības|2\. stāvs|SSIZC|Atjaunots|Ieaudzēts|Plantācijas|Nepieciešamais|Pēdējais darbības)/.test(l)){if(/^(Aizs|Īpatn)/.test(l))cur["ierobežojumi"]=((cur["ierobežojumi"]||"")+" "+l).trim().slice(0,200);continue;}
  if(buf){const t=(buf.rest+" "+l);const mt=t.match(tail);if(mt){finishA(buf,mt);push(buf);cur=buf;buf=null;}else{buf.rest=t;}continue;}
  if((m=l.match(head))){const r={kadastrs:kad,"kvartāls":kv,nogabals:m[1],"platība":m[2],inv_gads:inv};const rest=m[3];
   const mv=rest.match(/^(Mežaudze|Izcirtums)\s+(\S+)\s+(.*)$/);
   if(!mv){r.veids=rest.replace(/\s+/g," ");push(r);cur=r;continue;}
   r.veids=mv[1];r["meža_tips"]=mv[2];const mt=mv[3].match(tail);
   if(mt){finishA(r,mt);push(r);cur=r;}else{buf=r;buf.rest=mv[3];}
   continue;}
  if(cur&&/^(Aizsargjoslas|Ūdenstilpju)/.test(l))cur["ierobežojumi"]=((cur["ierobežojumi"]||"")+" "+l).trim().slice(0,200);
 }
 return [CANON.slice(),...recs.map(r=>CANON.map(k=>r[k]??""))];}
function finishA(r,mt){r.formula=mt[1].trim();r.suga=firstSp(r.formula);const bon=mt[3];const n=mt[4].trim().split(/\s+/).map(Number);
 r.augstums=n[0];r["caurmērs"]=n[1];r.vecums=n[2];const tailn=n.slice(4),kr=n[n.length-1];r.kraja_ha=kr;
 for(const x of tailn.slice(0,-1)){if(x>=100)r.koki=x;else r["šķērslaukums"]=x;}
 r["krāja"]=Math.round(kr*parseFloat(r["platība"]));r.cirsma=cirtmetsKC(r.suga,r.vecums,bon);r["bonitāte"]=bon;}

  h+=`<div class="card scroll"><h2>Aizsargjoslas (Aizsargjoslu likums)${p.infra?"":' <span class="muted">infrastruktūras dati vēl nav ielādēti</span>'}</h2>${rows?`<table><tr><th>Nog.</th><th style="text-align:left">Ūdensobjekts</th><th>KC aizliegts ha (≤${aj().kcBand} m)</th><th>10 m josla ha</th><th style="text-align:left">Sekas</th></tr>${rows}</table>`:'<div class="muted">Īpašums nesaskaras ar ūdenstecēm, ezeriem vai purviem (pēc OSM datiem).</div>'}<div class="muted">Kokmateriālu krautuves aizsargjoslā aizliegtas visā joslas platumā; 10 m joslā aizliegti pievešanas koridori. Platumi maināmi Iestatījumos. Nopirktajiem: <label class="btn sm sec" style="display:inline-flex;cursor:pointer">Importēt ATIS (kadastrs.lv)<input type="file" style="display:none" onchange="toast('ATIS imports: atsūti failu paraugu no kadastrs.lv e-pakalpojuma, pieslēgšu formātu')"></label></div></div>`;}
 h+=`<div class="card scroll"><h2>Kaimiņu svaigie izcirtumi (informācijai, limitu neietekmē)</h2>${p.kaimCuts&&p.kaimCuts.length?`<table><tr><th>Kaimiņa ZV</th><th>Kv/nog.</th><th>ha</th><th>Cirte</th><th>Gads</th><th>Atjaunots</th><th>Blakus mūsu nog.</th></tr>${p.kaimCuts.map(k=>`<tr><td>${esc(k.kad)}</td><td>${esc(k.kv)}/${esc(k.nog)}</td><td>${fmt(k.ha,2)}</td><td>${esc(k.cirte)}</td><td>${esc(k.gads)}</td><td>${esc(k.atj)}</td><td>${esc(k.nog_own.join(", "))}</td></tr>`).join("")}</table>`:'<div class="muted">Nav (vai objekts nav no pagasta faila).</div>'}<div class="muted">VMD izsniegtos apliecinājumus publiski vairs nerāda; zināmos ievadi ar roku: <input placeholder="nogabals; cirte; izsniegts DD.MM.GGGG; derīgs līdz" style="max-width:360px" onchange="(P().aplieci=P().aplieci||[]).push({own:true,nog:[this.value.split(';')[0].trim()],veids:(this.value.split(';')[1]||'').trim(),izsn:(this.value.split(';')[2]||'').trim(),derigs:(this.value.split(';')[3]||'').trim(),geom:{type:'Polygon',coordinates:[]},manual:true});this.value='';save(S.cur)"></div></div>`;
 h+=`<div class="card scroll"><h2>Ciršanas apliecinājumi (ievadītie)</h2>${p.aplieci&&p.aplieci.length?`<table><tr><th>Kur</th><th>Nogabali</th><th>Cirte</th><th>Izsniegts</th><th>Derīgs līdz</th><th>ha</th></tr>${p.aplieci.map(a=>`<tr><td>${a.own?"šajā īpašumā":"kaimiņa īpašumā "+esc(a.kad||"")}</td><td>${esc(a.nog.join(", "))}</td><td>${esc(a.veids)}</td><td>${esc(a.izsn)}</td><td>${esc(a.derigs)}</td><td>${esc(a.plat)}</td></tr>`).join("")}</table>`:`<div class="muted">${p.aplieciChecked?"Pārbaudīts "+p.aplieciChecked+": apliecinājumu nav.":"Nav pārbaudīts (dati atjaunojas katru nakti)."}</div>`}</div>`;
 h+=`<div class="card scroll"><h2>Kailcirte pa mitruma grupām</h2><table><tr><th>Grupa</th><th>KC ha</th><th>neto m³</th><th>limits ha/cirsma</th><th>min. cirsmu skaits</th><th>nogabali</th></tr>`;
 for(const mo of ["sausie","slapjie","?"]){const k=r.kc[mo];if(!k.n.length)continue;h+=`<tr><td>${mo==="sausie"?"Sausie (Sl, Mr, Ln, Dm, Vr, Gr)":mo==="slapjie"?"Slapjie, purvāji, āreņi, kūdreņi":"Nav tipa"}</td><td class="${k.limit&&k.ha>k.limit?"pctbad":""}">${fmt(k.ha,2)}</td><td>${fmt(k.m3)}</td><td>${k.limit??"–"}</td><td>${k.minCirsmas??"–"}</td><td style="white-space:normal;text-align:left">${k.n.map(m=>m.nogabals).join(", ")}</td></tr>`;}
 h+=`</table><div class="muted">Neto m³ = krāja mīnus ekoloģiskie koki (${RULES.ecoTreesHa.KC}/ha KC, ${RULES.ecoTreesHa.KKC}/ha kopšanā, ${RULES.ecoTreeM3} m³ koks).</div></div>`;
 if(r.split.length){
  h+=`<div class="card scroll"><h2>Cirsmu sadalījuma priekšlikums</h2><table><tr><th>Cirsma</th><th>Nogabali</th><th>ha</th><th>m³</th><th>Piezīme</th></tr>`;
  const grpIdxOf=m=>r.split.findIndex(g=>g.nog.some(e=>e.m===m));
  r.split.forEach((g,i)=>{const notes=[];
   for(const b of r.buffers){let otherM=null;if(g.nog.some(e=>e.m===b.victim))otherM=b.other;else if(g.nog.some(e=>e.m===b.other))otherM=b.victim;
    if(otherM){const j=grpIdxOf(otherM);if(j>=0&&j!==i)notes.push(`josla ar cirsmu ${j+1} (nog. ${b.a}-${b.b})`);}}
   h+=`<tr><td>${i+1} (${esc(g.mo)})</td><td style="white-space:normal;text-align:left">${esc(g.nog.map(e=>e.m.nogabals).join("; "))}</td><td>${fmt(g.ha,2)}</td><td>${fmt(g.m3)}</td><td style="white-space:normal;text-align:left" class="${notes.length?"pctwarn":""}">${notes.join("; ")||"–"}</td></tr>`;});
  h+=`</table><div class="muted">Cirsmas veidotas pēc reālas ģeometriskas piegulības (MK935 18.p., kopēja robeža > 50 m), katra ≤ MK935 15./16.p. limitu (sausie 5 ha, slapjie 2 ha, jaukta kopā ≤5 ar slapjo daļu ≤2).</div>`;
  if(r.oversized.length)h+=`<h3 style="margin:10px 0 4px">Nogabali, kas paši > limitu (MK935 23.p., ${SPLIT_SEP_M} m josla pa šaurāko virzienu)</h3><table><tr><th>Nog.</th><th>Kopā ha</th><th>KC daļa ha</th><th>Josla ha</th><th>Atlikums ha</th><th>Atliktie m³</th><th>Gads</th></tr>${r.oversized.map(sp=>`<tr><td>${esc(sp.x.m.nogabals)}</td><td>${fmt(num(sp.x.m.platMezs||sp.x.m.platKop),2)}</td><td>${fmt(sp.kcHa,2)}</td><td>${fmt(sp.stripHa,2)}</td><td>${fmt(sp.restHa,2)}</td><td>${fmt(sp.stripM3+sp.restM3)}</td><td>${sp.year}</td></tr>`).join("")}</table>`;
  if(r.buffers.length)h+=`<h3 style="margin:10px 0 4px">Atdalošās joslas ${bufM()} m starp piegulošām cirsmām — PRAKSE VMD saskaņošanai, ne tieša MK935 prasība (19./20.p. nosaka tikai kopējo limitu un 3 g atjaunošanās vecumu, ne joslas platumu)</h3><table><tr><th>Pāris</th><th>Robeža m</th><th>Josla paliek nog.</th><th>Cirsma</th><th>ha</th><th>m³ atlikti</th><th>Gads</th><th></th></tr>${r.buffers.map(b=>`<tr><td>${esc(b.a)}-${esc(b.b)}</td><td>${b.L}${b.real?" (ģeometrija)":" (novērtēts)"}${b.widened?" · paplašināta līdz "+b.widened+" m, lai ≥ 0,1 ha":""}</td><td>${esc(b.nog)}</td><td>${b.grp}</td><td>${fmt(b.stripHa,2)}</td><td>${fmt(b.m3)}</td><td>${b.year}</td><td><button class="btn sm sec" onclick="toggleDeferPair('${b.pairKey}')">Atlikt otru cirsmu bez joslas</button></td></tr>`).join("")}<tr class="tot"><td>KOPĀ</td><td></td><td></td><td></td><td>${fmt(r.buffers.reduce((a,b)=>a+b.stripHa,0),2)}</td><td>${fmt(r.buffers.reduce((a,b)=>a+b.m3,0))}</td><td></td><td></td></tr></table><div class="muted">Noklusējums: josla tajā pusē, kas zaudē mazāk m³ (mazāka krāja/ha). "Atlikt otru cirsmu bez joslas" ir likumā balstīta alternatīva (MK935 20.p.: piegulošo cirsmu drīkst cirst, kad atjaunotā audze sasniegusi 3 g).</div>`;
  h+=`<button class="btn amber" style="margin-top:8px" onclick="applySplit()">${ARM==="split"?"Aizstās esošās Kc cirsmas. Spied vēlreiz":"Pārveidot cirsmas pēc šī sadalījuma"}</button></div>`;}
 const flagged=r.nog.filter(x=>x.f.length);
 h+=`<div class="card"><h2>Nogabali ar piezīmēm (${flagged.length})</h2><div class="list">${flagged.map(x=>`<div class="item"><div class="t"><b>${x.m.kvartals?"kv."+esc(x.m.kvartals)+" ":""}nog. ${esc(x.m.nogabals)} · ${esc(x.m.mezaTips)} · ${esc(x.m.suga)} ${x.m.vecums||""}g · ${fmt(x.kr)} m³ (${fmt(x.krha)} m³/ha) ${x.m.cirsmaKods?"· "+x.m.cirsmaKods:""}</b><small>${x.f.map(f=>`<span class="${f.t==="bloks"?"pctbad":f.t==="warn"?"pctwarn":f.t==="info"?"pctinfo":""}">${esc(f.s)}</span>`).join(" · ")}</small></div></div>`).join("")||'<div class="empty">Piezīmju nav.</div>'}</div></div>`;
 const realistic=r.nog.filter(x=>x.m.cirsmaKods&&!x.exclude);const rm3=realistic.reduce((a,x)=>a+Math.max(x.kr-x.eco,0),0),rha=realistic.reduce((a,x)=>a+num(x.m.platMezs||x.m.platKop),0);
 h+=`<div class="card"><h2>Realistiskais apjoms</h2><div class="kv"><span>Pēc ekonomiskā filtra un bloķētāju izslēgšanas</span><b>${fmt(rha,2)} ha · ${fmt(rm3)} m³</b></div><div class="kv"><span>Visi nogabali ar cirsmas kodu</span><b>${fmt(r.nog.filter(x=>x.m.cirsmaKods).reduce((a,x)=>a+num(x.m.platMezs||x.m.platKop),0),2)} ha · ${fmt(r.nog.filter(x=>x.m.cirsmaKods).reduce((a,x)=>a+Math.max(x.kr-x.eco,0),0))} m³</b></div></div>`;
 h+=`<div class="card"><h2>Pirms iesnieguma</h2>${PRECHECK.map(t=>`<div class="kv"><span>${esc(t)}</span></div>`).join("")}</div>`;
 return h;}
function cirsmaLegal(c){const p=P();const linked=p.mer.filter(m=>m.cirsma===c.id);if(!linked.length)return "";const r=runChecks(p);const rows=r.nog.filter(x=>linked.includes(x.m));
 const groups={};for(const x of rows)groups[x.mo]=(groups[x.mo]||0)+num(x.m.platMezs||x.m.platKop);const zone=RULES.iadt[p.iadt||""];let h=`<div class="species" style="border-top-color:var(--amber)"><h3>Likumdošana šai cirsmai</h3>`;
 if(c.tips==="Kc"){if(!zone.kc)h+=`<div class="kv"><span class="pctbad">KC aizliegta izvēlētajā ĪADT zonā</span></div>`;
  for(const mo in groups){const lim=zone.limit!==null?zone.limit:RULES.kcLimitHa[mo==="sausie"?"sausie":"slapjie"];const over=groups[mo]>lim+1e-9;h+=`<div class="kv"><span>${mo==="sausie"?"Sausie tipi":mo==="slapjie"?"Slapjie / purvāji / āreņi / kūdreņi":"Bez meža tipa"}, limits ${lim} ha</span><b class="${over?"pctbad":""}">${fmt(groups[mo],2)} ha ${over?"pārsniedz, jādala":"✓"}</b></div>`;}
  if(Object.keys(groups).length>1){const wet=groups["slapjie"]||0,tot=Object.values(groups).reduce((a,b)=>a+b,0);h+=`<div class="kv"><span>Jaukta cirsma (MK935 16.p.): kopā ≤ 5 ha, slapjā daļa ≤ 2 ha</span><b class="${(tot>5||wet>2)?"pctbad":""}">${fmt(tot,2)} ha, slapjie ${fmt(wet,2)} ha ${(tot>5||wet>2)?"pārsniedz":"✓"}</b></div>`;}}
 if(c.tips==="KKC"){const kr=rows.reduce((a,x)=>a+x.kr,0),ce=rows.reduce((a,x)=>a+(x.m.certamais||0),0);if(kr&&ce)h+=`<div class="kv"><span>Kopšanas intensitāte (cērtamais / krāja)</span><b class="${ce/kr*100>=RULES.maxThinPct?"pctbad":""}">${fmt(ce/kr*100)} %</b></div>`;}
 const eco=rows.reduce((a,x)=>a+x.eco,0);h+=`<div class="kv"><span>Ekoloģiskie koki (${RULES.ecoTreesHa[c.tips==="Kc"?"KC":"KKC"]||0}/ha), atskaitīti</span><b>${fmt(eco)} m³</b></div>`;
 for(const x of rows)for(const f of x.f)h+=`<div class="kv"><span>nog. ${esc(x.m.nogabals)}</span><b class="${f.t==="bloks"?"pctbad":f.t==="warn"?"pctwarn":f.t==="info"?"pctinfo":""}" style="text-align:right;white-space:normal;max-width:70%">${esc(f.s)}</b></div>`;
 return h+"</div>";}
function bufferSuggest(p,r){r=r||runChecks(p);const out={};
 for(const b of r.buffers){const m=b.victim;if(!m)continue;const ha=num(m.platMezs||m.platKop);out[m.id]=Math.min(100,Math.round((out[m.id]||0)+(ha?b.stripHa/ha*100:0)));} // #22: pēc objekta (b.victim), ne pēc nogabala numura (bija ambiguzs daudz-kvartālu objektos)
 for(const sp of (r.oversized||[])){const m=sp.x.m;const ha=num(m.platMezs||m.platKop);const def=sp.stripHa+sp.restHa;out[m.id]=Math.min(100,Math.round((out[m.id]||0)+(ha?def/ha*100:0)));}
 return out;}
function applyBuffers(p,r){const sug=bufferSuggest(p,r);for(const m of p.mer){if(m.buferManual)continue;m.buferPct=sug[m.id]||0;}}
// #22: alternatīva 20 m joslai — otro no divām piegulošām cirsmām atliek uz vēlāku periodu (MK935 20.p., 3 g pēc atjaunošanas) bez joslas
function toggleDeferPair(pairKey){const p=P();p.deferPairs=p.deferPairs||[];const i=p.deferPairs.indexOf(pairKey);
 if(i>=0)p.deferPairs.splice(i,1);else p.deferPairs.push(pairKey);save(S.cur);}
function applySplit(){const p=P();const r=runChecks(p);applyBuffers(p,r);if(ARM!=="split"){ARM="split";render();setTimeout(()=>{if(ARM==="split"){ARM=null;render();}},4000);return;}ARM=null;
 p.cirsmas=p.cirsmas.filter(c=>c.tips!=="Kc");
 r.split.forEach((g,i)=>{const c=newCirsma();c.tips="Kc";c.kvartals="";c.nogabali=g.nog.map(x=>x.m.nogabals).join(";");c.platiba=g.ha;
  for(const x of g.nog){x.m.cirsma=c.id;c.kvartals=c.kvartals||x.m.kvartals;}
  p.cirsmas.push(c);rebuildCirsma(c,p.mer.filter(m=>m.cirsma===c.id),p);});
 S.view="cirs";save(S.cur);toast("Cirsmas pārveidotas");}

/* migrācija: pārrēķina esošos objektus pēc jaunajiem noteikumiem */
const APP_VERSION="0.36";
function migrate(){if(S.migrated===APP_VERSION)return;const cur=S.cur;for(const p of S.props){S.cur=p.id;for(const c of p.cirsmas){const linked=p.mer.filter(m=>m.cirsma===c.id);if(!linked.length)continue;
  for(const m of linked){const bad=(m.hasCert&&!(m.certamais>0))||/aizliegts/i.test(m.ierob||"")||(c.tips==="KKC"&&m.cirsmaKods!=="KKC")||(c.tips==="Kc"&&m.cirsmaKods!=="KC");if(bad)m.cirsma="";}
  const now=p.mer.filter(m=>m.cirsma===c.id);c.nogabali=now.map(m=>m.nogabals).join(";");if(now.length)rebuildCirsma(c,now,p);}
 p.cirsmas=p.cirsmas.filter(c=>c.nogabali||Object.values(c.species).some(v=>v.m3));}
 S.cur=cur;S.migrated=APP_VERSION;localStorage.setItem(KEY,JSON.stringify(S));}
migrate();
/* boot */
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").then(r=>{r.update();r.addEventListener("updatefound",()=>{const w=r.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="activated"&&navigator.serviceWorker.controller)location.reload();});});}).catch(()=>{});
document.getElementById("ver").textContent="v"+APP_VERSION;
render();
</script>
