name: sentinel
on:
  push: {branches: [main], paths: [SENTINEL_RUN]}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      has_result: ${{ steps.check.outputs.has_result }}
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf pagasti  # #43: pagasti/ vēsturiski nejauši nokļuvis main zarā; svaigo (data zara) versiju paņem tālāk
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: |
          git fetch --force origin data:data || true
          git --work-tree=. checkout data -- pagasti || true
          git --work-tree=. checkout data -- sentinel || true
          ls pagasti | head -3
      - run: python -u sentinel.py $(cat SENTINEL_RUN) 2>&1 | tee run.log
        env: {CDSE_ID: "${{ secrets.CDSE_ID }}", CDSE_SECRET: "${{ secrets.CDSE_SECRET }}"}
      - if: always()
        run: |
          git config user.name bot; git config user.email b@l
          mkdir -p logs; cp run.log "logs/sentinel_$(date -u +%F_%H%M).md"; git add logs; git commit -m "sentinel log" && git pull --rebase origin main && git push || true
      - id: check
        run: (ls sentinel/*.json.gz >/dev/null 2>&1 && echo "has_result=true" || echo "has_result=false") >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.has_result == 'true'
        with: {name: sentinel-result, path: "sentinel/", retention-days: 3}
  publish:
    needs: build
    if: needs.build.outputs.has_result == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: {group: data-publish, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: sentinel-result, path: sentinel}
      - run: bash scripts/publish_data.sh sentinel
