name: discover
on:
  push: {branches: [main], paths: [DISCOVER]}
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python -u discover.py 2>&1 | tee run.log
      - if: always()
        run: |
          git config user.name bot; git config user.email b@l
          mkdir -p logs; cp run.log "logs/discover_$(date -u +%F_%H%M).md"; git add logs; git commit -m "discover log" && git pull --rebase origin main && git push || true
