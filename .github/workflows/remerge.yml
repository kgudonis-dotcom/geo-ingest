name: remerge-pagasti
on:
  push: {branches: [main], paths: [REMERGE]}
permissions: {contents: write, actions: read}
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: {group: data-publish, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf pagasti  # #43: pagasti/ vēsturiski nejauši nokļuvis main zarā; nekad nedrīkst sajaukties ar šī darba svaigo izvadi
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {path: artifacts, pattern: "pagasti-*", run-id: "${{ github.event.head_commit.message }}", github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          git fetch --force origin data:data && mkdir -p artifacts/existing && git --work-tree=artifacts/existing checkout data -- pagasti || true
          python merge_pagasti.py 2>&1 | tee merged.log
          ls pagasti/*.json.gz >/dev/null 2>&1 || { echo "TUKŠS"; exit 0; }
          git config user.name bot; git config user.email b@l
          mkdir -p logs; cp merged.log "logs/remerge_$(date -u +%F_%H%M).md"; git add logs; git commit -m "remerge log" && git pull --rebase origin main && git push || true
          bash scripts/publish_data.sh pagasti
