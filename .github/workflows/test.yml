name: app-tests
on:
  push: {branches: [main], paths: ["app/**", "tests/**"]}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm init -y >/dev/null && npm i jsdom @turf/turf xlsx
      - run: node tests/regress.js
