name: build-infra
on:
  schedule:
    - cron: "0 5 7 * *"
  push: {branches: [main], paths: [INFRA_RUN]}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      has_result: ${{ steps.check.outputs.has_result }}
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf pagasti  # #43: pagasti/ vēsturiski nejauši nokļuvis main zarā; svaigo (data zara) versiju paņem tālāk
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: git fetch origin data:data && git --work-tree=. checkout data -- pagasti || true
      # pipefail: bez tā cauruļvada statuss ir tee (0) un avarējusi būve tiek rādīta kā "success" ar has_result=false un klusi izlaistu publish (03.09.2026 run 33753777273)
      - run: set -o pipefail; python -u build_infra.py 2>&1 | tee run.log
      - if: always()
        run: |
          git config user.name bot; git config user.email b@l
          mkdir -p logs; cp run.log "logs/infra_$(date -u +%F_%H%M).md"; git add logs; git commit -m "infra log" && git pull --rebase origin main && git push || true
      - id: check
        run: (ls infra/*.json.gz >/dev/null 2>&1 && echo "has_result=true" || echo "has_result=false") >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.has_result == 'true'
        with: {name: infra-result, path: "infra/", retention-days: 3}
  publish:
    needs: build
    if: needs.build.outputs.has_result == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: {group: data-publish, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: infra-result, path: infra}
      - run: bash scripts/publish_data.sh infra
