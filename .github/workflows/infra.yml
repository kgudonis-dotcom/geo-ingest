name: build-infra
on:
  schedule:
    - cron: "0 5 7 * *"
  push: {branches: [main], paths: [INFRA_RUN]}
permissions: {contents: write}
jobs:
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency: {group: data-publish, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf pagasti  # #43: pagasti/ vēsturiski nejauši nokļuvis main zarā; svaigo (data zara) versiju paņem tālāk
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: git fetch origin data:data && git --work-tree=. checkout data -- pagasti || true
      - run: python -u build_infra.py 2>&1 | tee run.log
      - if: always()
        run: |
          git config user.name bot; git config user.email b@l
          mkdir -p logs; cp run.log "logs/infra_$(date -u +%F_%H%M).md"; git add logs; git commit -m "infra log" && git pull --rebase origin main && git push || true
          ls infra/*.json.gz >/dev/null 2>&1 || exit 0
          bash scripts/publish_data.sh infra
