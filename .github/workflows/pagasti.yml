name: build-pagasti
on:
  schedule:
    - cron: "0 2 6 1,4,7,10 *"
  push: {branches: [main], paths: [PAGASTI_ARGS]}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Esošie pagastu faili (data zars), lai papildinātu
        run: |
          git fetch origin data:data 2>/dev/null && git checkout data -- pagasti 2>/dev/null || true
          git checkout main -- . 2>/dev/null || true
      - name: Build
        run: |
          ARGS=$(cat PAGASTI_ARGS 2>/dev/null || echo "")
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS=""; fi
          python -u build_pagasti.py $ARGS 2>&1 | tee run.log
      - name: Publish to data branch
        if: always()
        run: |
          git config user.name bot; git config user.email b@l
          mkdir -p logs; cp run.log "logs/pagasti_$(date -u +%F_%H%M).md" || true
          git add logs && git commit -m "pagasti log" && git push || true
          git checkout --orphan data-new
          git rm -rf --cached . >/dev/null 2>&1 || true
          git fetch origin data:data 2>/dev/null && git checkout data -- aplieci 2>/dev/null || true
          git add -f pagasti aplieci 2>/dev/null || git add -f pagasti
          git commit -m "pagasti $(date -u +%F)" && git push -f origin data-new:data
