name: export-geo
on:
  push: {branches: [main], paths: [EXPORT_REQ]}
permissions: {contents: write}
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python export_geo.py
        env: {DATABASE_URL: "${{ secrets.DATABASE_URL }}"}
      - if: always()
        run: |
          git config user.name bot; git config user.email b@l
          git pull --rebase || true; git add geo || true
          git commit -m "geo export" && git push || true
