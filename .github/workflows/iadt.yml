name: iadt-rules
on:
  schedule:
    - cron: "0 4 1 * *"
  push: {branches: [main], paths: [IADT_RUN]}
permissions: {contents: write}
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python -u build_iadt_rules.py 2>&1 | tee run.log
      - if: always()
        run: |
          git config user.name bot; git config user.email b@l
          mkdir -p logs; cp run.log "logs/iadt_$(date -u +%F_%H%M).md"; git add logs; git commit -m "iadt log" && git pull --rebase origin main && git push || true
          ls iadt/rules.json >/dev/null 2>&1 || exit 0
          git fetch --force origin data:data 2>/dev/null || true
          git checkout --orphan data-new; git rm -rf --cached . >/dev/null 2>&1 || true
          git checkout data -- pagasti aplieci infra sentinel 2>/dev/null || true
          git add -f pagasti iadt; git add -f aplieci infra sentinel 2>/dev/null || true
          git commit -m "iadt $(date -u +%F)" && git push -f origin data-new:data
