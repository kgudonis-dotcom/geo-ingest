name: iadt-rules
on:
  schedule:
    - cron: "0 4 1 * *"
  push: {branches: [main], paths: [IADT_RUN]}
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python -u build_iadt_rules.py 2>&1 | tee run.log
      - if: always()
        run: |
          git config user.name bot; git config user.email b@l
          mkdir -p logs; cp run.log "logs/iadt_$(date -u +%F_%H%M).md"; git add logs; git commit -m "iadt log" && git pull --rebase origin main && git push || true
      - name: Pārbauda, ka iadt/rules.json ir izveidots un nav tukšs (tukšā faila drošinātājs -> kļūda, ne klusa izlaišana)
        run: |
          test -s iadt/rules.json || { echo "::error::iadt/rules.json neeksistē vai ir tukšs — ekstrakcija neizdevās"; exit 1; }
          python3 -c "import json,sys; d=json.load(open('iadt/rules.json',encoding='utf-8')); n=d.get('count',0); print('extracted valid rules:',n); sys.exit(0 if n>0 and len(d.get('items',{}))==n else 1)" || { echo "::error::rules.json satur 0 spēkā esošu noteikumu vai count neatbilst items skaitam"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: {name: iadt-result, path: "iadt/", retention-days: 3}
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: {group: data-publish, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: iadt-result, path: iadt}
      - name: Publicē iadt/rules.json data zarā (kopīgais publicētājs, tikai sava apakšmape)
        run: bash scripts/publish_data.sh iadt
      - name: Pārbauda, ka publicēšana tiešām nostrādāja (workflow beidzas ar kļūdu, ja fails nav publicēts)
        run: |
          git fetch --force origin data:data
          git show data:iadt/rules.json > /tmp/published_rules.json || { echo "::error::iadt/rules.json push izpildījās, bet pēc tam data zarā faila nav"; exit 1; }
          python3 -c "import json,sys; d=json.load(open('/tmp/published_rules.json',encoding='utf-8')); n=d.get('count',0); print('published to data branch:',n,'valid rules'); sys.exit(0 if n>0 else 1)" || { echo "::error::publicētais iadt/rules.json ir tukšs"; exit 1; }
